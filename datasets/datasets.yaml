# How to prepare each dataset: steps + loading code, all tested on 2026-10-26 in plain
# Python (anndata 0.13, scanpy 1.12, h5py, scipy, pandas, rdata 1.1; no R). Rendered as the
# "How to prepare" section of each dataset page. Availability of every file is checked
# without downloading by manuscripts/plan-a/notes/check_datasets.py.
prepare:
  lake-2023:
    steps:
      - en: "Download the cellxgene single-nucleus h5ad (1.57 GB): 172,847 nuclei × 28,813 genes. `X` is normalised; the integer counts are in `raw.X`."
        zh: "下载 cellxgene 的单核 h5ad（1.57 GB）：172,847 核 × 28,813 基因。`X` 是归一化后的值，整数计数在 `raw.X`。"
      - en: "The cellxgene file has cell types (`subclass.l1/l2`) but **no `state.l1/l2`**. Download the GEO metadata (19 MB) and join on the cell ID: all 172,847 IDs match."
        zh: "cellxgene 文件里有细胞类型（`subclass.l1/l2`），但**没有 `state.l1/l2`**。再下载 GEO 标签表（19 MB），按细胞 ID 合并：172,847 个全部对得上。"
      - en: "The cellxgene file leaves out 30,855 of GEO's 203,702 nuclei, including **all COVID-AKI patients** (19,678 nuclei) and the 3,364 nuclei without a state. If you need them, read GEO's count RDS instead (second code block)."
        zh: "cellxgene 版比 GEO 少了 30,855 个核（GEO 共 203,702 个），其中包括**全部 COVID-AKI 病人**（19,678 核）和 3,364 个没有状态标签的核。需要这些的话，改读 GEO 的计数 RDS（第二段代码）。"
      - en: "GEO's `.RDS` files are R sparse matrices (dgCMatrix). The `rdata` package reads them in Python; no R needed (SNARE2 RNA: 30,574 genes × 104,809 nuclei in about 4 s)."
        zh: "GEO 的 `.RDS` 是 R 的稀疏矩阵（dgCMatrix），用 `rdata` 包在 Python 里就能读，不用装 R（SNARE2 RNA：30,574 基因 × 104,809 核，约 4 秒）。"
    code: |
      import scanpy as sc, pandas as pd
      adata = sc.read_h5ad("lake2023_sn.h5ad")           # cellxgene single-nucleus file
      adata.X = adata.raw.X                               # integer counts
      meta = pd.read_csv("GSE183277_Kidney_Healthy-Injury_Cell_Atlas_snCv3_Metadata_03282022.txt.gz",
                         sep="\t", index_col=0, low_memory=False,
                         dtype={"patient": str})          # patient IDs mix numbers and text
      adata.obs = adata.obs.join(meta[["state.l1", "state.l2", "condition.l2", "patient"]])

      # GEO count matrix without R (gunzip the .RDS.gz first)
      import rdata, numpy as np, scipy.sparse as sp
      m = rdata.read_rds("GSE183277_Kidney_Healthy-Injury_Cell_Atlas_snCv3_Counts_03282022.RDS")
      X = sp.csc_matrix((np.asarray(m.x), np.asarray(m.i), np.asarray(m.p)), shape=tuple(m.Dim))
      genes, cells = list(m.Dimnames[0]), list(m.Dimnames[1])   # genes x cells
  mbdrc-2026:
    steps:
      - en: "Download the cellxgene all-assay h5ad (1.41 GB): 97,125 cells × 36,030 genes; integer counts in `raw.X`."
        zh: "下载 cellxgene 的全部测法 h5ad（1.41 GB）：97,125 细胞 × 36,030 基因；整数计数在 `raw.X`。"
      - en: "`obs` already holds what the benchmark needs: `assay` (10x 3′ v3 / 5′ v1 / multiome), `donor_id` (18 donors), `sample_id` (28), `author_cell_type` (36 types), `pct_counts_mt`, preservation method."
        zh: "`obs` 里已经有基准要用的列：`assay`（10x 3′ v3 / 5′ v1 / multiome）、`donor_id`（18 名供体）、`sample_id`（28 个）、`author_cell_type`（36 种）、`pct_counts_mt`、保存方式。"
      - en: "For the assay-change task, group cells by `donor_id` × `assay`. The multiome-only h5ad (0.3 GB) and its ATAC fragments (4.1 GB) are only needed for ATAC."
        zh: "做“换测法”任务时，按 `donor_id` × `assay` 分组。只有用到 ATAC 时，才需要 multiome 单独的 h5ad（0.3 GB）和它的 ATAC fragments（4.1 GB）。"
    code: |
      import scanpy as sc
      adata = sc.read_h5ad("mbdrc_all.h5ad")
      adata.X = adata.raw.X
      adata.obs.groupby(["donor_id", "assay"], observed=True).size()
  abedini-2024:
    steps:
      - en: "Per-cell labels (`Cluster_Idents` cell type, `tech`, `group`, sex, age, QC) are in `GSE211785_scRNA-seq_snRNA-seq_snATAC-seq_metadata.txt.gz` (9 MB, 338,565 rows); the `EXPORT_..._umap.txt.gz` has only cell ID and UMAP. Counts are in the h5ad (5.0 GB gzipped, **18 GB** unzipped); open it in backed mode."
        zh: "每个细胞的标签（细胞类型 `Cluster_Idents`、`tech`、`group`、性别、年龄、QC）在 `GSE211785_scRNA-seq_snRNA-seq_snATAC-seq_metadata.txt.gz`（9 MB，338,565 行）里；`EXPORT_..._umap.txt.gz` 只有细胞 ID 和 UMAP。计数在 h5ad 里（压缩 5.0 GB，**解压后 18 GB**），用 backed 模式打开。"
      - en: "338,565 cells × 34,733 genes. `X` is normalised; integer counts are in `layers[\"counts\"]`. `tech` = SC_RNA / SN_RNA / SN_ATAC; `group` = Control / DKD / HKD; `sample` = 44 people."
        zh: "338,565 细胞 × 34,733 基因。`X` 是归一化后的值，整数计数在 `layers[\"counts\"]`。`tech` = SC_RNA / SN_RNA / SN_ATAC；`group` = Control / DKD / HKD；`sample` = 44 人。"
      - en: "Numeric obs columns are stored as text; convert them before use. `nCount_RNA` is not an integer, most likely because ambient RNA was corrected with SoupX before release (Supplementary Information; our inference); whether `layers[\"counts\"]` is before or after that correction is not confirmed."
        zh: "obs 里的数值列存成了文本，用之前要先转类型。`nCount_RNA` 不是整数，很可能是因为发布前用 SoupX 校正过 ambient RNA（补充材料；这是我们的推断）；`layers[\"counts\"]` 是校正前还是后，还没确认。"
      - en: "Controls by person: 14 single-cell, 7 single-nucleus, 7 ATAC."
        zh: "对照组人数：单细胞 14、单核 7、ATAC 7。"
    code: |
      import anndata as ad
      a = ad.read_h5ad("GSE211785_Susztak_SC_SN_ATAC_merged_PreSCVI_final.h5ad", backed="r")
      rna = a[a.obs["tech"].astype(str) != "SN_ATAC"].to_memory()
      rna.X = rna.layers["counts"]
  hoeft-2024:
    steps:
      - en: "Download only the kidney sample GSM8397034 (matrix + barcodes + features, 68 MB) instead of the 611 MB RAW.tar: 36,601 genes × 11,490 nuclei, median 1,055 UMIs per nucleus."
        zh: "只下载肾样本 GSM8397034（矩阵 + 条形码 + 基因表，68 MB），不用下 611 MB 的整包：36,601 基因 × 11,490 核，每个核中位 1,055 个 UMI。"
      - en: "The kidney genotypes are the four small VCFs (TS116, TS120, TS121, TS126; from bulk RNA-seq, so only about a thousand sites each, e.g. 1,260 in TS116). Confirm on the GEO sample pages that these are the kidney donors."
        zh: "肾样本的基因型是四个小 VCF（TS116、TS120、TS121、TS126；来自 bulk RNA-seq，每个只有一千多个位点，例如 TS116 有 1,260 个）。用之前在 GEO 样本页确认它们就是这 4 个肾病人。"
      - en: "The matrix is filtered and the donor of each nucleus is not public, so the doublet and ambient ground truth needs a rerun from FASTQ (SRR29832267, about 29 GB in SRA, 95 Gb of bases): CellRanger, then souporcell or vireo with the VCFs."
        zh: "矩阵已经过滤，每个核属于谁也没公开。所以要得到 doublet 和 ambient 真值，得从 FASTQ（SRR29832267，SRA 文件约 29 GB，95 Gb 碱基）重跑：先 CellRanger，再用 VCF 跑 souporcell 或 vireo。"
    code: |
      import scanpy as sc, pandas as pd
      k = sc.read_mtx("GSM8397034_Kidney_Pooled_matrix.mtx.gz").T      # -> nuclei x genes
