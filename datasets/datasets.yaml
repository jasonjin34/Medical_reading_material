    zh: "小鼠肾用 37 °C 和冰上冷解离、新鲜 / 冻存 / 甲醇固定、三种单核方法对比。人肾没有这样的对照实验。"
  figure:
    file: denisenko2020_fig1.jpg
    en: "Denisenko 2020 Fig. 1. A: 37 °C dissociation, B: cold dissociation, each fresh / methanol-fixed / cryopreserved for single-cell, plus bulk; C–E: three nucleus-extraction methods; F: whole-tissue bulk as reference. Genome Biol 2020, CC BY 4.0."
    zh: "Denisenko 2020 Fig. 1。A：37 °C 解离，B：冰上冷解离，各自再分新鲜 / 甲醇固定 / 冻存做单细胞，并做 bulk；C–E：三种提取细胞核的方法；F：整块组织 bulk 当参照。Genome Biol 2020，CC BY 4.0。"
  measured:
    en: "Single-cell and single-nucleus RNA (10x)."
    zh: "单细胞和单核 RNA（10x）。"
  samples:
