# Datasets shown under the site's "Datasets" tab. Single source for dataset facts:
# the overview table and every dataset page are generated from this file by
# scripts/build_site.py. Numbers were checked on 2026-10-26 against GEO, Zenodo,
# cellxgene, SRA and the papers' full text; "counted by us" numbers come from the
# downloaded GEO label tables. Public site: no unpublished lab data here.
#
# group: disease | measurement | calibration | source
# assays: any of sc, sn, atac, multiome, spatial, genotype
# use_in: research topic ids (research/topics.yaml) -> how the topic uses it

groups:
  disease:
    en: "Disease cohorts (human): healthy reference and disease labels"
    zh: "疾病队列（人）：健康参考和“病”的答案"
  measurement:
    en: "Measurement controls (human): known answers for measurement-caused anomalies"
    zh: "测量对照（人）：“测量造成的异常”的已知答案"
  calibration:
    en: "Calibration (mouse): experiments human kidney data does not have"
    zh: "小鼠校准：人肾数据里没有的实验"
  source:
    en: "Data sources and portals"
    zh: "数据来源和平台"

assay_labels:
  sc: {en: "scRNA", zh: "单细胞 RNA"}
  sn: {en: "snRNA", zh: "单核 RNA"}
  atac: {en: "ATAC", zh: "ATAC"}
  multiome: {en: "multiome", zh: "同核 RNA+ATAC"}
  spatial: {en: "spatial", zh: "空间"}
  genotype: {en: "genotype", zh: "基因型"}

datasets:

- id: lake-2023
  name: "Lake 2023 · Kidney atlas (KPMP / HuBMAP)"
  name_zh: "Lake 2023 · 人肾图谱（KPMP / HuBMAP）"
  group: disease
  species: human
  paper: lake-kidney-atlas-nature-2023
  cite: "Lake BB et al. Nature 2023;619:585–594. doi:10.1038/s41586-023-05769-3"
  assays: [sc, sn, multiome, spatial]
  scale: {en: "203,702 nuclei (sn) + 109,741 cells (sc) + 104,809 nuclei (SNARE2)", zh: "单核 203,702 + 单细胞 109,741 + SNARE2 104,809"}
  people: {en: "71 people in the three single-cell parts (35 healthy, 19 CKD, 17 AKI)", zh: "三份单细胞数据合计 71 人（35 健康、19 CKD、17 AKI）"}
  labels: {en: "cell type + reference / altered state for every cell", zh: "每个细胞都有细胞类型和正常 / 改变标签"}
  tissue: {en: "patients: mostly KPMP biopsies (3 CKD nephrectomies in snCv3); healthy: nephrectomy, deceased donor, living-donor biopsy; cortex, medulla, papilla", zh: "病人：大多是 KPMP 活检（单核数据里有 3 名 CKD 来自肾切除）；健康人：肾切除、死亡供体、活体供体活检；皮质、髓质、乳头"}
  processed: {en: "filtered counts; raw FASTQ controlled, so no empty droplets", zh: "过滤后的计数；原始 FASTQ 受控，拿不到空液滴"}
  access: open
  licence: "CC BY 4.0 (cellxgene); GEO: not stated"
  oneliner:
    en: "The standard human kidney atlas, and the only public kidney dataset with healthy donors, patients, and a reference / altered label on every cell."
    zh: "肾脏的标准参考图谱，也是唯一同时有健康人、病人，并且给每个细胞标了“正常 / 改变”的公开肾脏数据。"
  figure:
    file: lake2023_fig1.jpg
    en: "Lake 2023 Fig. 1. a: kidney tissue (biopsy, nephrectomy or deceased donor) is dissociated into cells, nuclei are extracted, or it is sectioned; 10x Cv3 (single-cell / single-nucleus RNA) and SNARE2 (RNA + ATAC in one nucleus); b: people per assay; c: the integrated atlas. Nature 2023, CC BY 4.0."
    zh: "Lake 2023 Fig. 1。a：肾组织（活检、肾切除或死亡供体）解离成细胞、提取细胞核或切片 → 10x Cv3（单细胞 / 单核 RNA）和 SNARE2（同一个核 RNA + ATAC）；b：各测法的人数；c：整合后的图谱。Nature 2023，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA (snCv3, 203,702 nuclei, 36 people); single-cell RNA (scCv3, 109,741 cells, 45 people, all biopsies); SNARE-seq2 RNA + ATAC in the same nucleus (104,809 nuclei, 7 healthy donors only); spatial (Visium, Slide-seq), not used by us."
    zh: "单核 RNA（snCv3，203,702 核，36 人）；单细胞 RNA（scCv3，109,741 细胞，45 人，全是活检）；SNARE-seq2 同一个核测 RNA + ATAC（104,809 核，只有 7 名健康人）；空间（Visium、Slide-seq），我们不用。"
  samples:
    en: "The paper reports 45 healthy reference donors and 48 AKI / CKD patients, including people with spatial data only. Healthy tissue comes from partial or total nephrectomies, deceased-donor kidneys not used for transplant, and living-donor biopsies; the paper does not say whether the nephrectomies were for tumours. Patient tissue is mostly KPMP research biopsies, but in the single-nucleus data 3 of the 13 CKD patients are nephrectomies (counted by us). 14 patients have both single-nucleus and single-cell data (counted by us)."
    zh: "论文写 45 名健康参考供体、48 名 AKI / CKD 病人，其中包括只做了空间测序的人。健康组织来自部分或全部肾切除、没有用于移植的死亡供体肾、活体供体活检；论文没有说肾切除是不是因为肿瘤。病人组织大多是 KPMP 研究用穿刺活检，但单核数据里 13 名 CKD 病人中有 3 名来自肾切除（我们数的）。14 个病人同时有单核和单细胞数据（我们数的）。"
  label_detail:
    en: "`subclass.l1/l2/l3` (17 classes, 75 subclasses) and `state.l1/l2` (reference, degenerative, adaptive, cycling, transitioning); 28 subclasses are altered. Labels were assigned by experts after clustering, not measured."
    zh: "`subclass.l1/l2/l3`（17 个大类、75 个亚类）和 `state.l1/l2`（reference、degenerative、adaptive、cycling、transitioning）；28 个亚类是 altered。标签是聚类后专家判读的，不是测出来的。"
  issues:
    - en: "In single-nucleus data, degenerative nuclei have fewer genes (median 791 vs 1,736) and more mitochondrial RNA (3.0% vs 0.6%) than reference nuclei, like low-quality cells; in single-cell data the pattern is reversed (counted by us)."
      zh: "单核数据里，退化态的核基因更少（中位 791 vs 正常 1,736）、线粒体比例更高（3.0% vs 0.6%），像低质量细胞；单细胞数据里正好相反（我们数的）。"
    - en: "Healthy donors carry altered cells too: 26% of their nuclei in the single-nucleus data (the authors suggest procurement ischaemia or normal ageing)."
      zh: "健康人身上也有 altered 细胞：单核数据里占 26%（作者认为可能来自取样缺血或正常衰老）。"
    - en: "Raw sequencing is controlled (KPMP / dbGaP), so there are no empty droplets for ambient estimation."
      zh: "原始测序是受控访问（KPMP / dbGaP），拿不到空液滴，没法直接估计 ambient。"
  downloads:
    - {fmt: RDS, what: {en: "GEO GSE183277 snCv3 count matrix", zh: "GEO GSE183277 单核 snCv3 计数矩阵"}, size: "868 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183277"}
    - {fmt: TXT, what: {en: "snCv3 per-cell metadata with state.l1 / l2", zh: "单核每个细胞的标签表（含 state.l1 / l2）"}, size: "19 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183277"}
    - {fmt: RDS, what: {en: "GEO GSE183276 scCv3 counts + metadata", zh: "GEO GSE183276 单细胞 scCv3 计数 + 标签表"}, size: "1.3 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183276"}
    - {fmt: RDS, what: {en: "GEO GSE183273 SNARE2 RNA counts + ATAC peak counts", zh: "GEO GSE183273 SNARE2 RNA 计数 + ATAC 峰计数"}, size: "0.5 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183273"}
    - {fmt: TSV, what: {en: "SNARE2 ATAC fragments + index", zh: "SNARE2 ATAC fragments + 索引"}, size: "15 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183273"}
    - {fmt: H5AD, what: {en: "cellxgene: single-cell, single-nucleus, integrated (RNA only)", zh: "cellxgene：单细胞、单核、整合（只有 RNA）"}, size: "2.19 / 1.57 / 2.96 GB", url: "https://cellxgene.cziscience.com/collections/bcb61471-2a44-4d00-a0af-ff085512674c"}
  download_note:
    en: "Use the GEO RDS + metadata when you need the altered labels. GSE183279_RAW.tar (3.5 GB) is spatial data. Raw FASTQ is at KPMP / dbGaP and needs an application."
    zh: "需要 altered 标签时用 GEO 的 RDS + 标签表。GSE183279_RAW.tar（3.5 GB）是空间数据。原始 FASTQ 在 KPMP / dbGaP，要申请。"
  use_in:
    anomaly-benchmark:
      en: "Healthy reference; disease ground truth (altered states, tier 3); base for artifact injection."
      zh: "健康参考；“病”的答案（altered 状态，三级）；注入伪影的底板。"
    agent-claims:
      en: "Source of known results (for example aTAL markers) to check agent claims against."
      zh: "已知结论的来源（例如 aTAL 的标记基因），用来核对 agent 的结论。"

- id: abedini-2024
  name: "Abedini 2024 · Second cohort"
  name_zh: "Abedini 2024 · 第二队列"
  group: disease
  species: human
  paper: abedini-kidney-atlas-natgenet-2024
  cite: "Abedini A et al. Nat Genet 2024. doi:10.1038/s41588-024-01802-x"
  assays: [sc, sn, atac, spatial]
  scale: {en: "338,565 cells / nuclei", zh: "338,565 细胞 / 核"}
  people: {en: "36 control + 45 CKD samples (20 DKD, 25 HKD)", zh: "36 份对照 + 45 份 CKD（20 糖尿病肾病、25 高血压肾病）"}
  labels: {en: "cell types; disease group per sample", zh: "细胞类型；每个样本的疾病组"}
  tissue: {en: "unaffected tissue from tumour nephrectomies", zh: "肿瘤肾切除的未受累组织"}
  processed: {en: "ambient (SoupX) and doublets (DoubletFinder) already removed; non-integer counts; no raw data", zh: "已去 ambient（SoupX）和 doublet（DoubletFinder）；计数非整数；没有原始数据"}
  access: open
  licence: "not stated"
  oneliner:
    en: "A second lab and a second set of people: used to test whether false alarms on healthy donors stay under control."
    zh: "换一个实验室、换一批人，检验方法在健康人身上的误报率能不能控住。"
  measured:
    en: "Single-cell RNA, single-nucleus RNA, snATAC (measured separately, not multiome), Visium and CosMx."
    zh: "单细胞 RNA、单核 RNA、snATAC（分开测，不是同核），还有 Visium 和 CosMx。"
  samples:
    en: "Unaffected tissue from tumour nephrectomies. Controls: eGFR > 60 and fibrosis < 10%. By person: 14 single-cell and 7 single-nucleus controls; only 8 people have both single-cell and single-nucleus data."
    zh: "肿瘤肾切除的未受累组织。对照：eGFR > 60 且纤维化 < 10%。按人数：单细胞对照 14 人、单核对照 7 人；单细胞和单核只有 8 人重叠。"
  label_detail:
    en: "Cell types and the disease group of each sample; no per-cell altered state."
    zh: "细胞类型和每个样本的疾病组；没有逐个细胞的改变态标签。"
  issues:
    - en: "Ambient RNA (SoupX) and doublets (DoubletFinder) were already removed, so part of the artifacts is gone; counts are SoupX-corrected (non-integer)."
      zh: "已经用 SoupX 去过 ambient、用 DoubletFinder 去过 doublet，伪影被提前洗掉了一部分；计数是 SoupX 校正后的（非整数）。"
    - en: "Controls have lower data quality than patients (median genes per cell in single-cell data about 358 vs 598); some controls have hypertension."
      zh: "对照组的数据质量反而更差（单细胞每细胞基因数中位约 358，疾病组约 598）；部分对照有高血压。"
    - en: "Single-cell data used 37 °C enzymatic digestion, so it carries dissociation stress. No raw data (\"due to privacy concerns\")."
      zh: "单细胞是 37 °C 酶解，会有解离应激。没有原始数据（原文：“due to privacy concerns”）。"
  downloads:
    - {fmt: H5AD, what: {en: "GEO GSE211785: sc + sn + ATAC, before / after scVI", zh: "GEO GSE211785：sc + sn + ATAC 合并，scVI 前 / 后"}, size: "4.7 / 5.5 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: H5AD, what: {en: "same, merged with KPMP data", zh: "同上，加上 KPMP 数据的版本"}, size: "9.0 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: RDS, what: {en: "count matrix (sc + sn + ATAC)", zh: "计数矩阵（sc + sn + ATAC）"}, size: "1.7 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: TXT, what: {en: "per-cell metadata + UMAP", zh: "每个细胞的标签表 + UMAP"}, size: "15 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
  download_note:
    en: "The paper is not open access and not CC-licensed, so no original figure is shown here. The licence of the data must be confirmed before releasing derived labels."
    zh: "论文不是 CC 授权，这里不放原图。发布派生标签前要先确认数据许可。"
  use_in:
    anomaly-benchmark:
      en: "Task T4: every anomaly called on a healthy donor counts as a false alarm; does the observed rate stay below the target?"
      zh: "任务 T4：健康人身上报出的“异常”都算误报，看实际误报率是否低于设定值。"

- id: mbdrc-2026
  name: "mBDRC 2026 · One donor, three assays"
  name_zh: "mBDRC 2026 · 同一个人三种测法"
  group: measurement
  species: human
  paper: kidney-multimodal-genomebiol-2026
  cite: "Acera-Mateos M et al. Genome Biol 2026."
  assays: [sc, multiome]
  scale: {en: "119,744 cells / nuclei", zh: "119,744 细胞 / 核"}
  people: {en: "19 healthy donors, 33 samples of normal cortex", zh: "19 名健康供体，33 份正常皮质"}
  labels: {en: "cell types; assay and donor per cell", zh: "细胞类型；每个细胞的测法和供体"}
  tissue: {en: "normal cortex at nephrectomy; cortex only", zh: "肾切除时取的正常皮质；只有皮质"}
  processed: {en: "processed matrices (cellxgene, Zenodo); raw at dbGaP, on application", zh: "处理后的矩阵（cellxgene、Zenodo）；原始数据在 dbGaP，要申请"}
  access: open
  licence: "CC BY 4.0 (data); paper CC BY-NC-ND 4.0"
  oneliner:
    en: "The same healthy kidney cortex split and measured with three assays: differences caused by the assay are a real, design-given answer, no injection needed."
    zh: "同一块健康肾皮质分装后用三种方法测。换测法造成的差异是实验设计给定的真实答案，不靠注入。"
  figure:
    file: mbdrc_fig1.jpg
    en: "Acera-Mateos 2026 Fig. 1, unmodified. Bottom left, \"DATA SCHEME\": 10x Multiome (11 samples, RNA + ATAC), 10x 3′ v3 (18), 10x 5′ v1 (4), all healthy cortex; the rest is the paper's integration framework, which we do not use. Genome Biol 2026, CC BY-NC-ND 4.0."
    zh: "Acera-Mateos 2026 Fig. 1，未改动。左下“DATA SCHEME”就是数据：10x Multiome 11 份（RNA + ATAC）、10x 3′ v3 18 份、10x 5′ v1 4 份，都是健康皮质；其余部分是论文比较整合方法的框架，我们不用。Genome Biol 2026，CC BY-NC-ND 4.0。"
  measured:
    en: "3′ single-cell RNA, 5′ single-cell RNA, and 10x multiome (snRNA + snATAC in the same nucleus)."
    zh: "3′ 单细胞 RNA、5′ 单细胞 RNA，以及 10x multiome（同一个核里测 snRNA + snATAC）。"
  samples:
    en: "19 healthy donors; normal cortex taken at nephrectomy. Cortex only, no medulla."
    zh: "19 名健康供体；肾切除时取的正常皮质。只有皮质，没有髓质。"
  label_detail:
    en: "Cell types, plus the assay and donor of every cell. Key number from the paper: the assay explains about 24% of expression variance, the donor about 3%."
    zh: "细胞类型，以及每个细胞的测法和供体。论文的关键数字：表达差异里测法解释约 24%，供体只解释约 3%。"
  issues:
    - en: "Healthy donors only, and cortex only."
      zh: "只有健康人，只有皮质。"
  downloads:
    - {fmt: H5AD, what: {en: "cellxgene: integrated RNA, 97,125 cells (3′ / 5′ / multiome)", zh: "cellxgene：整合 RNA，97,125 细胞（3′ / 5′ / multiome）"}, size: "1.41 GB"}
    - {fmt: H5AD, what: {en: "cellxgene: multiome, 37,717 nuclei", zh: "cellxgene：multiome 37,717 核"}, size: "0.3 GB"}
    - {fmt: TSV, what: {en: "cellxgene: ATAC fragments + index", zh: "cellxgene：ATAC fragments + 索引"}, size: "4.1 GB"}
    - {fmt: tar.gz, what: {en: "Zenodo: all processed data + README", zh: "Zenodo：全部处理后数据 + README"}, size: "35.2 GB", url: "https://doi.org/10.5281/zenodo.18157241"}
  download_note:
    en: "The three cellxgene files (about 6 GB) are enough to start. Raw sequencing is at dbGaP phs004459 and needs an application."
    zh: "先下 cellxgene 的三个文件（约 6 GB）就够用。原始测序在 dbGaP phs004459，要申请。"
  use_in:
    anomaly-benchmark:
      en: "Task T2b: anything flagged as anomalous only because the same donor was measured with another assay is a false alarm (tier 2). Also extends the healthy reference."
      zh: "任务 T2b：同一个人换了测法就被报成“异常”的，一定是误报（二级答案）。也补充健康参考。"

- id: hoeft-2024
  name: "Hoeft 2024 · Four patients in one channel"
  name_zh: "Hoeft 2024 · 4 个病人混在一个通道"
  group: measurement
  species: human
  paper: hoeft-genotype-multiplexing-natcommun-2024
  cite: "Hoeft K et al. Nat Commun 2024;15:10612. doi:10.1038/s41467-024-54270-6"
  assays: [sn, genotype]
  scale: {en: "11,490 nuclei", zh: "11,490 核"}
  people: {en: "4 patients (frozen kidney biopsies)", zh: "4 名病人（冷冻肾活检）"}
  labels: {en: "donor by SNP; 250 genotype doublets (2.2%)", zh: "按 SNP 分出的供体；250 个基因型 doublet（2.2%）"}
  tissue: {en: "frozen kidney biopsies; diagnoses not reported", zh: "冷冻肾活检；没写诊断"}
  processed: {en: "GEO \"raw\" matrix is in fact filtered; FASTQ open, donor labels must be recomputed", zh: "GEO 上写“raw”的其实已过滤；FASTQ 公开，供体标签要重算"}
  access: open
  licence: "CC BY 4.0 (paper)"
  oneliner:
    en: "Four patients' kidney biopsies pooled in one 10x single-nucleus channel and separated by SNPs: the only human kidney data where real ambient RNA and doublets can be computed."
    zh: "4 名病人的冷冻肾活检混在一个 10x 单核通道里测，按 SNP 分出每个核来自谁。这是人肾上唯一能算出真实 ambient 和 doublet 的数据。"
  figure:
    file: hoeft2024_fig2ij.jpg
    en: "Hoeft 2024 Fig. 2 i–j (kidney part, cropped). i: expression clusters of the pooled kidney sample compared with three SNP-based donor assignments; j: share of each donor, doublets and unassigned nuclei per cluster. Most nuclei in the \"Low Quality\" and \"Mixed/Doublets\" clusters belong to a single donor. Nat Commun 2024, CC BY 4.0."
    zh: "Hoeft 2024 Fig. 2 i–j（肾部分，已截取）。i：混合肾样本的表达聚类，和三种按 SNP 分人的结果对照；j：每个簇里各病人、doublet 和未分配核的比例。注意“Low Quality”和“Mixed/Doublets”簇里大部分核其实只属于一个病人。Nat Commun 2024，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA (10x 3′ v3.1); bulk RNA-seq per patient, turned into genotype files (VCF)."
    zh: "单核 RNA（10x 3′ v3.1）；每个病人另有 bulk RNA-seq，做成了基因型文件（VCF）。"
  samples:
    en: "4 patients; the diagnoses are not reported."
    zh: "4 名病人；论文没有写诊断。"
  label_detail:
    en: "A nucleus carrying another donor's alleles is contaminated (ambient); a droplet with two genotypes is a doublet. Per-nucleus donor assignments are not public and must be recomputed from the raw data."
    zh: "核里出现别人的等位基因 = 外来污染（ambient）；一个液滴里有两种基因型 = doublet。每个核的供体分配没有公开，要从原始数据重算。"
  issues:
    - en: "The GEO matrix labelled \"raw\" is already filtered (no empty droplets); ambient RNA is not quantified in the paper."
      zh: "GEO 上写“raw”的矩阵其实已经过滤，没有空液滴；论文没有量化 ambient。"
    - en: "Only 4 people: enough for validation, not for main results."
      zh: "只有 4 人，只够做验证，不能当主结果。"
    - en: "Useful finding: the expression cluster \"Mixed/Doublets\" holds 4,488 nuclei (39%), but only 123 of them are genotype doublets (counted by us from the Source Data). Judging the cause of an anomaly from expression alone is unreliable."
      zh: "有用的发现：按表达聚出的“Mixed/Doublets”簇有 4,488 个核（39%），其中按基因型确认是 doublet 的只有 123 个（我们从 Source Data 算的）。只看表达，判断异常原因很不可靠。"
  downloads:
    - {fmt: MTX, what: {en: "GEO GSE247708: kidney 10x matrix (filtered, 11,490 nuclei)", zh: "GEO GSE247708：肾样本 10x 矩阵（已过滤，11,490 核）"}, size: "65 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE247708"}
    - {fmt: VCF, what: {en: "genotypes of the 4 kidney patients (from bulk RNA-seq)", zh: "4 个肾病人的基因型（来自 bulk RNA-seq）"}, size: "≈ 0.4 MB each", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE247708"}
