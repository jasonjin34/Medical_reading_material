- id: lake-2019
  name: "Lake 2019 · Same patients, different storage and processing"
  name_zh: "Lake 2019 · 同一个病人多种保存处理"
  group: measurement
  species: human
  paper: lake-snrna-pipeline-natcommun-2019
  cite: "Lake BB et al. Nat Commun 2019;10:2832. doi:10.1038/s41467-019-10861-2"
  assays: [sn]
  scale: {en: "17,659 nuclei (after QC)", zh: "17,659 核（QC 后）"}
  people: {en: "15 people (nephrectomies and deceased donors)", zh: "15 人（肾切除和死亡供体）"}
  labels: {en: "30 clusters; processing method per library", zh: "30 个簇；每个文库的处理方式"}
  access: open
  licence: "CC BY 4.0 (paper)"
