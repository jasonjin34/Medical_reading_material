- id: wu-dkd-2022
  name: "Wu 2022 · Diabetic kidney disease under five treatments"
  name_zh: "Wu 2022 · 糖尿病肾病小鼠的五种治疗"
  group: perturbation
  species: mouse
  cite: "Wu H et al. Cell Metab 2022;34:1064–1078.e6. doi:10.1016/j.cmet.2022.05.010"
  assays: [sn]
  scale: {en: "nearly 1 million nuclei (GEO summary)", zh: "接近 100 万个核（GEO 摘要）"}
  people: {en: "70 female mice in 14 groups, 4–6 per group (one sample per mouse)", zh: "70 只雌鼠，14 组，每组 4–6 只（每只一个样本）"}
  labels: {en: "treatment arm × time point (2 days, 2 weeks)", zh: "治疗组 × 时间点（2 天、2 周）"}
  tissue: {en: "db/db mice with uninephrectomy and renin hypertension (a DKD model)", zh: "db/db 小鼠 + 单侧肾切除 + 肾素高血压（DKD 模型）"}
  processed: {en: "processed files on GEO (CSV, H5)", zh: "GEO 上有处理后的文件（CSV、H5）"}
  access: open
  licence: "GEO: not stated"
  oneliner:
    en: "Mouse DKD kidneys after vehicle, ACE inhibitor, rosiglitazone, SGLT2 inhibitor and two combinations, at two time points. Our reading: the cleanest public kidney data for predicting a combination from its single drugs."
    zh: "糖尿病肾病小鼠分别接受安慰剂、ACE 抑制剂、罗格列酮、SGLT2 抑制剂和两种联合用药，两个时间点。我们的理解：这是公开数据里最适合做“从单药预测联合用药”的肾脏数据。"
  measured:
    en: "Single-nucleus RNA of whole kidneys. Arms: vehicle, ACEi, rosiglitazone, SGLT2i, ACEi + rosiglitazone, ACEi + SGLT2i, each at 2 days and 2 weeks, plus db/m and db/db controls without the renin AAV (2 days only). The authors report that different drugs affected strikingly different cell types and that the combinations had the largest, largely non-overlapping effects (GEO summary)."
    zh: "全肾单核 RNA。分组：安慰剂、ACEi、罗格列酮、SGLT2i、ACEi + 罗格列酮、ACEi + SGLT2i，每组 2 天和 2 周两个时间点；另有 db/m 和不注射肾素 AAV 的 db/db 对照（只有 2 天）。作者报告：不同药物影响的细胞类型差别很大；联合用药效应最大，而且两种药的效应大多不重叠（GEO 摘要）。"
  issues:
    - en: "Mouse model, not patients; five treatments only, so it cannot test prediction for arbitrary unseen perturbations."
      zh: "是小鼠模型，不是病人；只有五种处理，没法检验“预测任意没见过的扰动”。"
  downloads:
    - {fmt: GEO, what: {en: "GSE184652 (CSV, H5)", zh: "GSE184652（CSV、H5）"}, size: "", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE184652"}
  download_note:
    en: "Download not yet tested."
    zh: "还没做下载检查。"
  use_in:
    hypothesis-agents:
      en: "Main source of questions: the held-out treated groups (a drug combination, the 2-week arm) are the measured answers the agents' hypotheses are scored against."
      zh: "主要出题来源：留出的处理组（联合用药、2 周组）就是实测答案，agent 的假设拿它来打分。"

- id: wu-sglt2-arb-2022
  name: "Wu 2022 · SGLT2 inhibitor and ARB in db/db mice"
  name_zh: "Wu 2022 · db/db 小鼠的 SGLT2 抑制剂和 ARB"
  group: perturbation
  species: mouse
  cite: "Wu J et al. Mol Ther 2022;30:1741–1753. doi:10.1016/j.ymthe.2021.10.013"
  assays: [sc]
  scale: {en: "30 GEO samples (sequencing lanes)", zh: "GEO 上 30 个样本（按测序 lane 分）"}
  people: {en: "about 2–4 mice per group (our count from the sample names)", zh: "每组约 2–4 只小鼠（我们按样本名数的）"}
  labels: {en: "treatment arm", zh: "治疗组"}
  tissue: {en: "db/db mice; db/m controls", zh: "db/db 小鼠；db/m 对照"}
  processed: {en: "processed files on GEO (RDS, TXT)", zh: "GEO 上有处理后的文件（RDS、TXT）"}
  access: open
  licence: "GEO: not stated"
  oneliner:
    en: "An independent lab's single-cell data on an SGLT2 inhibitor and RAS blockade (an ARB here, an ACE inhibitor in Wu H 2022) and their combination: a second lab for checking whether a finding transfers."
    zh: "另一个实验室用 SGLT2 抑制剂和 RAS 阻断（这里是 ARB，Wu H 2022 用的是 ACE 抑制剂）及其联用做的单细胞数据：用来检验一个结论换到另一个实验室还成不成立。"
  measured:
    en: "Single-cell RNA of kidneys from db/db mice treated with vehicle, ARB, SGLT2i or both, plus db/m mice. The authors report 10 clusters dominated by proximal tubule cells and a PT subcluster increased in DKD and reversed by treatment (GEO summary)."
    zh: "db/db 小鼠分别接受安慰剂、ARB、SGLT2i 或两者联用，加上 db/m 小鼠，测肾脏单细胞 RNA。作者报告 10 个簇，以近端小管为主，还有一个在 DKD 中增加、治疗后回落的近端小管亚群（GEO 摘要）。"
  issues:
    - en: "Male mice treated for 8 weeks, without renin AAV or uninephrectomy; Wu H 2022 used female mice for 2 days or 2 weeks, so the two differ in model, sex and duration as well as lab."
      zh: "雄性小鼠，处理 8 周，没有肾素 AAV 和单侧肾切除；Wu H 2022 用的是雌鼠，处理 2 天或 2 周。所以两者除了实验室不同，模型、性别和处理时长也不同。"
    - en: "Few mice per group; single-cell (not single-nucleus), so it differs from Wu H 2022 in assay as well as lab."
      zh: "每组小鼠少；是单细胞而不是单核，所以和 Wu H 2022 相比，不只实验室不同，测法也不同。"
  downloads:
    - {fmt: GEO, what: {en: "GSE181382 (RDS, TXT)", zh: "GSE181382（RDS、TXT）"}, size: "", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE181382"}
  download_note:
    en: "Download not yet tested."
    zh: "还没做下载检查。"
  use_in:
    hypothesis-agents:
      en: "Cross-lab questions: does a hypothesis formed on Wu H 2022 hold in another lab's data?"
      zh: "跨实验室的题：在 Wu H 2022 上得出的假设，换到另一个实验室的数据还成不成立？"

- id: attempt-sglt2i-2026
  name: "ATTEMPT 2026 · SGLT2 inhibitor vs placebo, baseline and 16-week biopsies"
  name_zh: "ATTEMPT 2026 · SGLT2 抑制剂对安慰剂，基线和 16 周的活检"
  group: perturbation
  species: human
  cite: "Bjornstad P et al. Sci Transl Med 2026;18:eaee1005. doi:10.1126/scitranslmed.aee1005"
  assays: [sc]
  scale: {en: "27 biopsies, 214,415 cells", zh: "27 份活检，214,415 个细胞"}
  people: {en: "dapagliflozin 9 before / 7 after, placebo 7 before / 4 after (counted from the GEO sample records)", zh: "dapagliflozin 组治疗前 9 份、治疗后 7 份；安慰剂组 7 份、4 份（按 GEO 样本记录数的）"}
  labels: {en: "arm and time point per sample; no per-cell labels", zh: "每个样本的分组和时间点；没有逐个细胞的标签"}
  tissue: {en: "kidney cortex biopsies from trial participants aged 18–21 with type 1 diabetes and hyperfiltration (the trial enrolled ages 12–21), at baseline and 16 weeks", zh: "试验里 18–21 岁、有 1 型糖尿病和高滤过的参与者的肾皮质活检（试验招募的是 12–21 岁），基线和 16 周"}
  processed: {en: "processed count matrices per sample on GEO; raw reads withheld", zh: "GEO 上有每个样本的处理后计数矩阵；原始 reads 不公开"}
  access: open
  licence: "GEO: not stated"
  oneliner:
    en: "The only public randomised human trial we found with single-cell data on kidney tissue before and after a drug: the human answer for treatment hypotheses."
    zh: "我们找到的唯一一项公开的、有用药前后肾组织单细胞数据的人类随机对照试验：治疗假设在人身上的答案。"
  measured:
    en: "Single-cell RNA of kidney biopsies taken before and after 16 weeks of dapagliflozin or placebo (trial NCT04333823)."
    zh: "用 dapagliflozin 或安慰剂 16 周前后的肾活检单细胞 RNA（试验编号 NCT04333823）。"
  issues:
    - en: "Small: only 11 follow-up biopsies; early disease in young people, so effects may differ from established CKD."
      zh: "样本少：随访活检只有 11 份；是青少年的早期病变，效应可能和成形的 CKD 不同。"
    - en: "No cell-type labels in the public files; cells must be annotated first, which is itself a step an agent can get wrong."
      zh: "公开文件里没有细胞类型标签，要先注释；这一步本身就是 agent 可能出错的地方。"
    - en: "GEO has no participant ID, so baseline and follow-up biopsies of the same person cannot be paired from the public data; only group comparisons are possible."
      zh: "GEO 上没有病人编号，公开数据没法把同一个人的基线和随访活检配对，只能按组比较。"
  downloads:
    - {fmt: GEO, what: {en: "GSE316742 (per-sample count matrices)", zh: "GSE316742（每个样本的计数矩阵）"}, size: "", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE316742"}
  download_note:
    en: "Download not yet tested."
    zh: "还没做下载检查。"
  use_in:
    hypothesis-agents:
      en: "Human treatment answers: the post-treatment biopsies are held out, and hypotheses about what an SGLT2 inhibitor does to each cell type are scored against them by group comparison."
      zh: "人的治疗答案：治疗后的活检留出，agent 关于 SGLT2 抑制剂对各类细胞作用的假设，按组比较来打分。"

- id: abedini-doca-rat-2024
  name: "Abedini 2024 · Rat hypertensive kidney injury under MR antagonists"
  name_zh: "Abedini 2024 · 大鼠高血压肾损伤和盐皮质激素受体拮抗剂"
  group: perturbation
  species: rat
  cite: "Abedini A et al. J Clin Invest 2024;134:e157165. doi:10.1172/JCI157165"
  assays: [sn, atac]
  scale: {en: "22 snRNA samples (310,218 nuclei); 9 snATAC samples (53,298 nuclei)", zh: "22 个单核 RNA 样本（310,218 个核）；9 个 snATAC 样本（53,298 个核）"}
  people: {en: "snRNA: sham 5, DOCA 5, +finerenone 5, +spironolactone 5, +amiloride 2 (one DOCA, one finerenone and one spironolactone sample at 3 weeks, the rest at 6 weeks); snATAC 2/2/2/2/1; male Sprague-Dawley rats", zh: "单核 RNA：假手术 5、DOCA 5、+finerenone 5、+螺内酯 5、+阿米洛利 2（DOCA、finerenone、螺内酯各有 1 个样本在 3 周，其余在 6 周）；snATAC 2/2/2/2/1；雄性 Sprague-Dawley 大鼠"}
  labels: {en: "treatment arm and cell type per nucleus; time point only in the GEO sample records", zh: "每个核的治疗组和细胞类型；时间点只在 GEO 样本记录里"}
  tissue: {en: "rat kidneys after uninephrectomy + DOCA + 1% salt (sham-operated controls), 3 or 6 weeks", zh: "单侧肾切除 + DOCA + 1% 盐水之后的大鼠肾（假手术对照），3 周或 6 周"}
  processed: {en: "counts and metadata on GEO", zh: "GEO 上有计数和标签表"}
  access: open
  licence: "GEO: not stated"
