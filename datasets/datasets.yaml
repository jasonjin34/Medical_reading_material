# Datasets shown under the site's "Datasets" tab. Single source for dataset facts:
# the overview table and every dataset page are generated from this file by
# scripts/build_site.py. Numbers were checked on 2026-10-26 against GEO, Zenodo,
# cellxgene, SRA and the papers' full text; "counted by us" numbers come from the
# downloaded GEO label tables. Public site: no unpublished lab data here.
#
# group: disease | measurement | calibration | perturbation | source
# assays: any of sc, sn, atac, multiome, spatial, genotype
# use_in: research topic ids (research/topics.yaml) -> how the topic uses it

groups:
  disease:
    en: "Disease cohorts (human): healthy reference and disease labels"
    zh: "疾病队列（人）：健康参考和“病”的答案"
  measurement:
    en: "Measurement controls (human): known answers for measurement-caused anomalies"
    zh: "测量对照（人）：“测量造成的异常”的已知答案"
  calibration:
    en: "Calibration (mouse): experiments human kidney data does not have"
    zh: "小鼠校准：人肾数据里没有的实验"
  perturbation:
    en: "Treatment and injury experiments: outcomes measured after a drug or an injury"
    zh: "治疗和损伤实验：用药或损伤之后实际测到的结果"
  source:
    en: "Data sources and portals"
    zh: "数据来源和平台"

assay_labels:
  sc: {en: "scRNA", zh: "单细胞 RNA"}
  sn: {en: "snRNA", zh: "单核 RNA"}
  atac: {en: "ATAC", zh: "ATAC"}
  multiome: {en: "multiome", zh: "同核 RNA+ATAC"}
  spatial: {en: "spatial", zh: "空间"}
  genotype: {en: "genotype", zh: "基因型"}

datasets:

- id: lake-2023
  name: "Lake 2023 · Kidney atlas (KPMP / HuBMAP)"
  name_zh: "Lake 2023 · 人肾图谱（KPMP / HuBMAP）"
  group: disease
  species: human
  paper: lake-kidney-atlas-nature-2023
  cite: "Lake BB et al. Nature 2023;619:585–594. doi:10.1038/s41586-023-05769-3"
  assays: [sc, sn, multiome, spatial]
  scale: {en: "203,702 nuclei (sn) + 109,741 cells (sc) + 104,809 nuclei (SNARE2)", zh: "单核 203,702 + 单细胞 109,741 + SNARE2 104,809"}
  people: {en: "71 people in the three single-cell parts (35 healthy, 19 CKD, 17 AKI)", zh: "三份单细胞数据合计 71 人（35 健康、19 CKD、17 AKI）"}
  labels: {en: "cell type + reference / altered state for every cell except 3,364 single-nucleus nuclei", zh: "除 3,364 个单核外，每个细胞都有细胞类型和正常 / 改变标签"}
  tissue: {en: "patients: mostly KPMP biopsies (3 CKD nephrectomies in snCv3); healthy: nephrectomy, deceased donor, living-donor biopsy; cortex, medulla, papilla", zh: "病人：大多是 KPMP 活检（单核数据里有 3 名 CKD 来自肾切除）；健康人：肾切除、死亡供体、活体供体活检；皮质、髓质、乳头"}
  processed: {en: "filtered counts; raw FASTQ controlled, so no empty droplets", zh: "过滤后的计数；原始 FASTQ 受控，拿不到空液滴"}
  access: open
  licence: "CC BY 4.0 (cellxgene); GEO: not stated"
  oneliner:
    en: "The standard human kidney atlas, with healthy donors, patients, and a reference / altered label on almost every cell. Our reading (as of 2026-10): we know of no other public kidney dataset with all three."
    zh: "肾脏的标准参考图谱，同时有健康人、病人，并且几乎每个细胞都标了“正常 / 改变”。我们的理解（截至 2026 年 10 月）：还没见过别的公开肾脏数据三样都有。"
  figure:
    file: lake2023_fig1.jpg
    en: "Lake 2023 Fig. 1. a: kidney tissue (biopsy, nephrectomy or deceased donor) is dissociated into cells, nuclei are extracted, or it is sectioned; 10x Cv3 (single-cell / single-nucleus RNA) and SNARE2 (RNA + ATAC in one nucleus); b: people per assay; c: the integrated atlas. Nature 2023, CC BY 4.0."
    zh: "Lake 2023 Fig. 1。a：肾组织（活检、肾切除或死亡供体）解离成细胞、提取细胞核或切片 → 10x Cv3（单细胞 / 单核 RNA）和 SNARE2（同一个核 RNA + ATAC）；b：各测法的人数；c：整合后的图谱。Nature 2023，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA (snCv3, 203,702 nuclei, 36 people); single-cell RNA (scCv3, 109,741 cells, 45 people, all biopsies); SNARE-seq2 RNA + ATAC in the same nucleus (104,809 nuclei, 7 healthy donors only); spatial (Visium with H&E images, Slide-seq); the Visium sections are a candidate for expert annotation in the artifact-injection topic (under discussion)."
    zh: "单核 RNA（snCv3，203,702 核，36 人）；单细胞 RNA（scCv3，109,741 细胞，45 人，全是活检）；SNARE-seq2 同一个核测 RNA + ATAC（104,809 核，只有 7 名健康人）；空间（Visium，带 H&E 图；Slide-seq）；Visium 切片是伪影注入课题里专家标注的候选（讨论中）。"
  samples:
    en: "The paper reports 45 healthy reference donors and 48 AKI / CKD patients, including people with spatial data only. Healthy tissue comes from partial or total nephrectomies, deceased-donor kidneys not used for transplant, and living-donor biopsies; the paper does not say whether the nephrectomies were for tumours. Patient tissue is mostly KPMP research biopsies, but in the single-nucleus data 3 of the 13 CKD patients are nephrectomies (counted by us). 14 patients have both single-nucleus and single-cell data (counted by us)."
    zh: "论文写 45 名健康参考供体、48 名 AKI / CKD 病人，其中包括只做了空间测序的人。健康组织来自部分或全部肾切除、没有用于移植的死亡供体肾、活体供体活检；论文没有说肾切除是不是因为肿瘤。病人组织大多是 KPMP 研究用穿刺活检，但单核数据里 13 名 CKD 病人中有 3 名来自肾切除（我们数的）。14 个病人同时有单核和单细胞数据（我们数的）。"
  label_detail:
    en: "`subclass.l1/l2/l3` (in the single-nucleus GEO table: 16 classes, 74 `subclass.l2` and 77 `subclass.l3` subclasses, plus NA for 3,364 unlabelled nuclei; the paper's \"77 subclasses\" are level 3) and `state.l1/l2` (reference, degenerative, adaptive, cycling, transitioning); 28 subclasses are altered. Labels were assigned by experts after clustering, not measured."
    zh: "`subclass.l1/l2/l3`（GEO 单核标签表里是 16 个大类、74 个 `subclass.l2` 亚类、77 个 `subclass.l3` 亚类，另有 3,364 个没有标签的核记为 NA；论文说的“77 个亚类”就是第 3 级）和 `state.l1/l2`（reference、degenerative、adaptive、cycling、transitioning）；28 个亚类是 altered。标签是聚类后专家判读的，不是测出来的。"
  issues:
    - en: "In single-nucleus data, degenerative nuclei have fewer genes (median 791 vs 1,736) and more mitochondrial RNA (3.0% vs 0.6%) than reference nuclei, like low-quality cells; in single-cell data the pattern is reversed (counted by us)."
      zh: "单核数据里，退化态的核基因更少（中位 791 vs 正常 1,736）、线粒体比例更高（3.0% vs 0.6%），像低质量细胞；单细胞数据里正好相反（我们数的）。"
    - en: "Healthy donors carry altered cells too: 26% of their nuclei in the single-nucleus data (the authors suggest procurement ischaemia or normal ageing)."
      zh: "健康人身上也有 altered 细胞：单核数据里占 26%（作者认为可能来自取样缺血或正常衰老）。"
    - en: "Raw sequencing is controlled (KPMP / dbGaP), so there are no empty droplets for ambient estimation."
      zh: "原始测序是受控访问（KPMP / dbGaP），拿不到空液滴，没法直接估计 ambient。"
  downloads:
    - {fmt: RDS, what: {en: "GEO GSE183277 snCv3 count matrix", zh: "GEO GSE183277 单核 snCv3 计数矩阵"}, size: "868 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183277"}
    - {fmt: TXT, what: {en: "snCv3 per-cell metadata with state.l1 / l2", zh: "单核每个细胞的标签表（含 state.l1 / l2）"}, size: "19 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183277"}
    - {fmt: RDS, what: {en: "GEO GSE183276 scCv3 counts + metadata", zh: "GEO GSE183276 单细胞 scCv3 计数 + 标签表"}, size: "1.3 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183276"}
    - {fmt: RDS, what: {en: "GEO GSE183273 SNARE2 RNA counts + ATAC peak counts", zh: "GEO GSE183273 SNARE2 RNA 计数 + ATAC 峰计数"}, size: "0.5 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183273"}
    - {fmt: TSV, what: {en: "SNARE2 ATAC fragments + index", zh: "SNARE2 ATAC fragments + 索引"}, size: "15 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE183273"}
    - {fmt: H5AD, what: {en: "cellxgene: single-cell, single-nucleus, integrated (RNA only)", zh: "cellxgene：单细胞、单核、整合（只有 RNA）"}, size: "2.19 / 1.57 / 2.96 GB", url: "https://cellxgene.cziscience.com/collections/bcb61471-2a44-4d00-a0af-ff085512674c"}
  download_note:
    en: "Use the GEO RDS + metadata when you need the altered labels. GSE183279_RAW.tar (3.5 GB) is spatial data. Raw FASTQ is at KPMP / dbGaP and needs an application."
    zh: "需要 altered 标签时用 GEO 的 RDS + 标签表。GSE183279_RAW.tar（3.5 GB）是空间数据。原始 FASTQ 在 KPMP / dbGaP，要申请。"
  use_in:
    anomaly-benchmark:
      en: "Healthy reference; disease ground truth for external validation (altered states); base for artifact injection."
      zh: "健康参考；外部验证里“病”的答案（altered 状态）；注入伪影的底板。"
    hypothesis-agents:
      en: "Discovery cohort: the agent forms its CKD hypotheses here; donors are split, and other cohorts are held out as answers. Do not use the GSE211785 KPMP-merged h5ad or unfiltered Klötzer 2025 data for held-out tests: they contain Lake donors."
      zh: "发现队列：agent 在这里提出 CKD 假设；供者先划分，其他队列留出当答案。不要用 GSE211785 里合并了 KPMP 的 h5ad 或没过滤的 Klötzer 2025 数据做留出检验：里面有 Lake 的供者。"

- id: abedini-2024
  name: "Abedini 2024 · Second cohort"
  name_zh: "Abedini 2024 · 第二队列"
  group: disease
  species: human
  paper: abedini-kidney-atlas-natgenet-2024
  cite: "Abedini A et al. Nat Genet 2024;56:1712–1724. doi:10.1038/s41588-024-01802-x"
  assays: [sc, sn, atac, spatial]
  scale: {en: "338,565 cells / nuclei", zh: "338,565 细胞 / 核"}
  people: {en: "58 people in the paper (81 samples: 36 control, 45 CKD of which 20 DKD, 25 HKD); the GEO single-cell data hold 44 of them (21 controls)", zh: "论文共 58 人（81 份样本：36 份对照，45 份 CKD，其中 20 糖尿病肾病、25 高血压肾病）；GEO 单细胞数据里有其中 44 人（21 名对照）"}
  labels: {en: "cell types; disease group per sample", zh: "细胞类型；每个样本的疾病组"}
  tissue: {en: "left-over (de-identified) kidney tissue; cortex and outer medulla", zh: "剩余的（去标识）肾组织；皮质和外髓"}
  processed: {en: "low-quality cells removed; ambient RNA corrected with SoupX and doublets removed with DoubletFinder (Supplementary Information); no raw data", zh: "已去低质量细胞；用 SoupX 校正了 ambient RNA、用 DoubletFinder 去了 doublet（补充材料）；没有原始数据"}
  access: open
  licence: "not stated"
  oneliner:
    en: "A second lab and a second set of people: used to test whether false alarms on healthy donors stay under control."
    zh: "换一个实验室、换一批人，检验方法在健康人身上的误报率能不能控住。"
  measured:
    en: "Single-cell RNA, single-nucleus RNA, snATAC (measured separately, not multiome), Visium and CosMx."
    zh: "单细胞 RNA、单核 RNA、snATAC（分开测，不是同核），还有 Visium 和 CosMx。"
  samples:
    en: "Left-over kidney tissue (the paper says only \"Left-over kidney samples\"); cortex and outer medulla. Controls: eGFR > 60 and fibrosis < 10%. By person (counted by us from the GEO metadata): 14 single-cell and 7 single-nucleus controls; 8 people (5 of them controls) have both single-cell and single-nucleus data."
    zh: "剩余的肾组织（论文只写了 “Left-over kidney samples”）；皮质和外髓。对照：eGFR > 60 且纤维化 < 10%。按人数（我们从 GEO 标签表数的）：单细胞对照 14 人、单核对照 7 人；同时有单细胞和单核数据的只有 8 人（其中对照 5 人）。"
  label_detail:
    en: "Cell types and the disease group of each sample; no per-cell altered state."
    zh: "细胞类型和每个样本的疾病组；没有逐个细胞的改变态标签。"
  issues:
    - en: "Counts are not integers (282,610 of 338,565 `nCount_RNA` values, counted by us), so they were corrected before release: the Supplementary Information says \"Ambient RNA was corrected using SoupX (v1.5.0) and doublets were removed by DoubletFinder (v2.0) with default parameters\". Part of the artifacts is therefore already gone."
      zh: "计数不是整数（338,565 个里有 282,610 个 `nCount_RNA` 非整数，我们数的），说明发布前做过校正：补充材料写明 “Ambient RNA was corrected using SoupX (v1.5.0) and doublets were removed by DoubletFinder (v2.0) with default parameters”。所以一部分伪影已经被提前洗掉了。"
    - en: "Single-cell data used 37 °C enzymatic digestion, so it carries dissociation stress. No raw data (\"due to privacy concerns\")."
      zh: "单细胞是 37 °C 酶解，会有解离应激。没有原始数据（原文：“due to privacy concerns”）。"
  downloads:
    - {fmt: H5AD, what: {en: "GEO GSE211785: sc + sn + ATAC, before / after scVI", zh: "GEO GSE211785：sc + sn + ATAC 合并，scVI 前 / 后"}, size: "4.7 / 5.5 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: H5AD, what: {en: "same, merged with KPMP data", zh: "同上，加上 KPMP 数据的版本"}, size: "9.0 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: RDS, what: {en: "count matrix (sc + sn + ATAC)", zh: "计数矩阵（sc + sn + ATAC）"}, size: "1.7 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
    - {fmt: TXT, what: {en: "per-cell metadata + UMAP", zh: "每个细胞的标签表 + UMAP"}, size: "15 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE211785"}
  download_note:
    en: "The paper is not open access and not CC-licensed, so no original figure is shown here. The licence of the data must be confirmed before releasing derived labels."
    zh: "论文不是开放获取，也不是 CC 授权，这里不放原图。发布派生标签前要先确认数据许可。"
  use_in:
    anomaly-benchmark:
      en: "Task T4: every anomaly called on a healthy donor is counted as a false alarm (our design choice; healthy tissue also carries altered cells, 26% of healthy-donor nuclei in Lake 2023); does the observed rate stay below the target?"
      zh: "任务 T4：健康人身上报出的“异常”都按误报算（这是我们的设定；健康组织里也有 altered 细胞，Lake 2023 单核数据里健康人有 26% 的核是 altered），看实际误报率是否低于设定值。"
    hypothesis-agents:
      en: "Held-out replication cohort (another centre and pipeline): does a CKD hypothesis formed on Lake 2023 hold here? Shares patients with Dumoulin 2026, so the two are never split against each other; its public annotation lacks aTAL, so score on genes, not state names. Do not use the GSE211785 KPMP-merged h5ad or unfiltered Klötzer 2025 data for held-out tests: they contain Lake donors."
      zh: "留出复现队列（换了中心和处理流程）：在 Lake 2023 上得出的 CKD 假设，在这里成不成立？和 Dumoulin 2026 共用病人，两者不能互相当发现和留出；公开注释里没有 aTAL，所以按基因打分，不比状态名。不要用 GSE211785 里合并了 KPMP 的 h5ad 或没过滤的 Klötzer 2025 数据做留出检验：里面有 Lake 的供者。"

- id: kuppe-2021
  name: "Kuppe 2021 · Human kidney fibrosis (hypertensive CKD)"
  name_zh: "Kuppe 2021 · 人肾纤维化（高血压性 CKD）"
  group: disease
  species: human
  cite: "Kuppe C et al. Nature 2021;589:281–286. doi:10.1038/s41586-020-2941-1"
  assays: [sc]
  scale: {en: "CD10− 53,672 cells, CD10+ 33,690, PDGFRβ+ 37,380 (paper text; the figure legends give 51,849 and 31,875)", zh: "CD10− 53,672 个细胞，CD10+ 33,690 个，PDGFRβ+ 37,380 个（论文正文；图注里是 51,849 和 31,875）"}
  people: {en: "13 patients with hypertensive nephrosclerosis (7 eGFR > 60, 6 < 60); CD10− 11 (7 / 4), CD10+ 8 (5 / 3), PDGFRβ+ 8 (4 / 4); no healthy controls", zh: "13 名高血压性肾硬化病人（7 名 eGFR > 60，6 名 < 60）；CD10− 11 人（7 / 4），CD10+ 8 人（5 / 3），PDGFRβ+ 8 个（4 / 4）；没有健康对照"}
  labels: {en: "cluster labels per cell (eGFR group per person in the files not yet checked)", zh: "每个细胞的聚类标签（文件里有没有每人的 eGFR 分组还没核对）"}
  tissue: {en: "tumour-free cortex from nephrectomies for kidney cancer (Hospital Eschweiler / RWTH Aachen), FACS-sorted fractions (CD10+, CD10−, PDGFRβ+)", zh: "因肾癌切除的肾里没有肿瘤的皮质（Eschweiler 医院 / RWTH Aachen），流式分选的几个部分（CD10+、CD10−、PDGFRβ+）"}
  processed: {en: "processed matrices with cluster labels on Zenodo", zh: "Zenodo 上有带聚类标签的处理后矩阵"}
  access: open
  licence: "CC BY 4.0 (Zenodo)"
  oneliner:
    en: "Human CKD tissue from a third centre (Aachen), sorted into fractions: an independent cohort for checking whether a CKD hypothesis formed elsewhere holds, especially on fibrosis."
    zh: "来自第三个中心（亚琛）的人 CKD 组织，分选成几个部分：用来检验在别的队列上得出的 CKD 假设在这里成不成立，尤其是纤维化。"
  measured:
    en: "Single-cell RNA of FACS-sorted CD10+, CD10− and PDGFRβ+ cells from human kidneys; spatial checks by RNA in-situ hybridisation (RNAscope), no spatial dataset released. The paper traces myofibroblasts mainly to pericytes and fibroblasts and supports it with fate tracing in mice."
    zh: "人肾里流式分选的 CD10+、CD10− 和 PDGFRβ+ 细胞的单细胞 RNA；空间上用 RNA 原位杂交（RNAscope）核对，没有发布空间数据集。论文把肌成纤维细胞主要追溯到周细胞和成纤维细胞，并在小鼠上用谱系追踪支持。"
  issues:
    - en: "Sorted fractions, so cell-type proportions are not those of the tissue; no healthy controls, only higher vs lower eGFR."
      zh: "是分选后的部分，细胞类型比例不等于组织里的比例；没有健康对照，只能比 eGFR 高和低。"
    - en: "The paper's own counts disagree: 13 patients with both fractions in the text, but 11 (CD10−) and 8 (CD10+) per fraction, and 15 kidneys in the Fig. 1b legend; Zenodo files not yet counted."
      zh: "论文自己的人数前后不一致：正文说两个部分都来自 13 人，按部分又是 11 人（CD10−）和 8 人（CD10+），图 1b 的图注写 15 个肾；Zenodo 文件还没数。"
  downloads:
    - {fmt: Zenodo, what: {en: "record 4059315: processed matrices and labels (human tarballs 109 / 257 / 243 MB)", zh: "记录 4059315：处理后的矩阵和标签（人的三个压缩包 109 / 257 / 243 MB）"}, size: "2.06 GB", url: "https://zenodo.org/records/4059315"}
  download_note:
    en: "Download not yet tested."
    zh: "还没做下载检查。"
  use_in:
    hypothesis-agents:
      en: "Held-out replication cohort for hypertensive CKD and fibrosis hypotheses; independent of the KPMP donors."
      zh: "高血压性 CKD 和纤维化假设的留出复现队列；和 KPMP 的供者没有重叠。"

- id: wilson-dkd-2022
  name: "Wilson 2022 · Diabetic kidney disease, RNA and chromatin"
  name_zh: "Wilson 2022 · 糖尿病肾病的 RNA 和染色质"
  group: disease
  species: human
  cite: "Wilson PC et al. Nat Commun 2022;13:5253. doi:10.1038/s41467-022-32972-z"
  assays: [sn, atac]
  scale: {en: "snRNA 39,176 nuclei; snATAC 68,458 nuclei (paper); CELLxGENE snATAC has 37,747 nuclei from 8 donors", zh: "单核 RNA 39,176 个核；snATAC 68,458 个核（论文）；CELLxGENE 上的 snATAC 只有 8 人的 37,747 个核"}
  people: {en: "snRNA 6 controls and 5 DKD; snATAC 6 and 7; all DKD with type 2 diabetes", zh: "单核 RNA 6 名对照、5 名 DKD；snATAC 6 名和 7 名；DKD 都是 2 型糖尿病"}
  labels: {en: "cell types (CELLxGENE); control or DKD per person", zh: "细胞类型（CELLxGENE）；每人是对照还是 DKD"}
  tissue: {en: "kidney cortex: 10 nephrectomies for renal mass, 3 deceased donors", zh: "肾皮质：10 例因肾肿物切除的肾，3 例遗体捐献"}
  processed: {en: "processed files on GEO; also on CELLxGENE", zh: "GEO 上有处理后的文件；CELLxGENE 上也有"}
  access: open
  licence: "GEO: not stated; CELLxGENE: CC BY 4.0"
  oneliner:
    en: "A small DKD cohort from another lab (Humphreys): one of the held-out cohorts for checking whether a DKD hypothesis replicates."
    zh: "另一个实验室（Humphreys 组）的小型 DKD 队列：检验 DKD 假设能不能复现的留出队列之一。"
  measured:
    en: "Single-nucleus RNA and single-nucleus ATAC of kidneys from controls and people with DKD; the paper reports a VCAM1+ injured proximal tubule state that is more frequent in DKD."
    zh: "对照和 DKD 病人肾的单核 RNA 和单核 ATAC；论文报告了一个在 DKD 里更多的 VCAM1+ 受损近端小管状态。"
  issues:
    - en: "Only 5–7 DKD donors, with large differences between donors."
      zh: "DKD 只有 5–7 人，人和人之间差别大。"
    - en: "Shares donors with earlier series: GSE131882 (Wilson et al., PNAS 2019) and GSE151302 (Muto et al., Nat Commun 2021). Controls 1–5 are the Muto 2021 donors; DKD 1–3 snRNA are the PNAS 2019 diabetic samples."
      zh: "和更早的数据共用供者：GSE131882（Wilson 等，PNAS 2019）和 GSE151302（Muto 等，Nat Commun 2021）。对照 1–5 就是 Muto 2021 的供者；DKD 1–3 的单核 RNA 就是 PNAS 2019 里的糖尿病样本。"
  downloads:
    - {fmt: GEO, what: {en: "GSE195460 (snRNA, snATAC)", zh: "GSE195460（单核 RNA、snATAC）"}, size: "", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE195460"}
  download_note:
    en: "Download not yet tested."
    zh: "还没做下载检查。"
  use_in:
    hypothesis-agents:
      en: "Held-out replication cohort for DKD hypotheses (from a different lab and pipeline than the discovery cohort)."
      zh: "DKD 假设的留出复现队列（实验室和处理流程都和发现队列不同）。"

- id: dumoulin-dkd-spatial-2026
  name: "Dumoulin 2026 · Spatial atlas of diabetic kidney disease"
  name_zh: "Dumoulin 2026 · 糖尿病肾病的空间图谱"
  group: disease
  species: human
  paper: dkd-spatial-atlas-nature-2026
  cite: "Dumoulin B et al. Nature 2026;653:1158–1169. doi:10.1038/s41586-026-10363-4"
  assays: [spatial]
  scale: {en: "64 FFPE samples (CosMx 48, Xenium 16); about 3.39 million CosMx and 0.95 million Xenium cells after filtering", zh: "64 份 FFPE 样本（CosMx 48 份，Xenium 16 份）；过滤后约 339 万个 CosMx 细胞、95 万个 Xenium 细胞"}
  people: {en: "58 patients (paper; 57 distinct IDs in Diagnosis.xlsx): about 26 DKD, 12 controls (2 children), 9 with diabetes and/or hypertension without DKD, and single cases of FSGS, IgAN, MN, C3GN, TMA and CKD, plus 2 AA amyloid", zh: "58 名病人（论文；Diagnosis.xlsx 里有 57 个不同编号）：约 26 名 DKD、12 名对照（其中 2 名儿童）、9 名有糖尿病和 / 或高血压但没有 DKD，另有 FSGS、IgA 肾病、膜性肾病、C3 肾小球病、血栓性微血管病和 CKD 各 1 例，以及 2 例 AA 淀粉样变"}
  labels: {en: "cell types and spatial niches in the paper (whether the h5ad holds niche labels is not yet checked); diagnosis per sample", zh: "论文里有细胞类型和空间 niche（h5ad 里有没有 niche 标签还没核对）；每个样本的诊断"}
  tissue: {en: "left-over, de-identified kidney samples, some from the TRIDENT study; formalin-fixed paraffin-embedded", zh: "剩余的、去标识的肾样本，部分来自 TRIDENT 研究；福尔马林固定石蜡包埋"}
  processed: {en: "annotated h5ad and a diagnosis table on Zenodo", zh: "Zenodo 上有注释好的 h5ad 和诊断表"}
  access: open
  licence: "CC BY 4.0 (Zenodo); paper CC BY-NC-ND 4.0"
  oneliner:
    en: "Imaging-based spatial data of DKD tissue: the spatial evidence for a hypothesis, and a 2026 result (a B-cell-rich DKD subgroup) that models with an earlier training cutoff cannot have seen."
    zh: "DKD 组织的成像空间数据：给假设提供空间佐证，也是 2026 年才发表的结果（一个富含 B 细胞的 DKD 亚组），训练截止更早的模型不可能见过。"
  measured:
    en: "CosMx (about 1,000 genes) and Xenium (5,100 genes; 656 shared with CosMx) on FFPE sections; the paper describes spatial niches that recur across patients and a B-cell-rich DKD subgroup."
    zh: "FFPE 切片上的 CosMx（约 1,000 个基因）和 Xenium（5,100 个基因，和 CosMx 共有 656 个）；论文描述了在病人之间反复出现的空间 niche，以及一个富含 B 细胞的 DKD 亚组。"
  issues:
    - en: "Shares patients (HK IDs) with Abedini 2024: HK2844, HK2924 (Abedini per-cell metadata) and HK2873, HK3035 (Abedini Visium file names) appear in both; 21 Dumoulin patients have non-HK IDs and cannot be checked. Never use the two as discovery and held-out cohort for each other."
      zh: "和 Abedini 2024 共用病人（HK 编号）：HK2844、HK2924（Abedini 每个细胞的标签表）和 HK2873、HK3035（Abedini Visium 文件名）两边都有；Dumoulin 有 21 名病人用的不是 HK 编号，没法核对。两者不能一个当发现队列、一个当留出队列。"
    - en: "Gene panels of 1k / 5k genes, so a hypothesis about a gene outside the panel cannot be checked here."
      zh: "基因面板只有 1k / 5k 个基因，面板外的基因在这里没法检验。"
  downloads:
    - {fmt: Zenodo, what: {en: "record 19868428: annotated h5ad + diagnosis table", zh: "记录 19868428：注释好的 h5ad + 诊断表"}, size: "8.75 GB", url: "https://zenodo.org/records/19868428"}
  download_note:
    en: "Download not yet tested. The paper cites 10.5281/zenodo.18674907, an earlier version of the same record without files; 19868428 is the current version."
    zh: "还没做下载检查。论文引用的是 10.5281/zenodo.18674907，是同一记录的早期版本，没有文件；19868428 是现在的版本。"
  use_in:
    hypothesis-agents:
      en: "Spatial evidence for hypotheses about cell states and niches; 2026 claims as time-split items where a model's cutoff is earlier."
      zh: "细胞状态和 niche 假设的空间佐证；对训练截止更早的模型，2026 年的结论可以出按时间切分的题。"

- id: mbdrc-2026
  name: "mBDRC 2026 · One donor, three assays"
  name_zh: "mBDRC 2026 · 同一个人三种测法"
  group: measurement
  species: human
  paper: kidney-multimodal-genomebiol-2026
  cite: "Acera-Mateos M et al. Genome Biol 2026;27:64. doi:10.1186/s13059-026-04002-4"
  assays: [sc, multiome]
  scale: {en: "119,744 cells / nuclei", zh: "119,744 细胞 / 核"}
  people: {en: "19 healthy donors, 33 samples of normal cortex", zh: "19 名健康供体，33 份正常皮质"}
  labels: {en: "cell types; assay and donor per cell", zh: "细胞类型；每个细胞的测法和供体"}
  tissue: {en: "normal cortex at nephrectomy; cortex only", zh: "肾切除时取的正常皮质；只有皮质"}
  processed: {en: "processed matrices (cellxgene, Zenodo); raw at dbGaP, on application", zh: "处理后的矩阵（cellxgene、Zenodo）；原始数据在 dbGaP，要申请"}
  access: open
  licence: "CC BY 4.0 (data); paper CC BY-NC-ND 4.0"
  oneliner:
    en: "Healthy kidney cortex from 19 donors, measured with up to three assays (in the cellxgene file 3 of 18 donors have all three, 8 have two): differences caused by the assay are a design-given answer, no injection needed."
    zh: "19 名供体的健康肾皮质，用最多三种方法测（cellxgene 文件里 18 人中 3 人三种都有、8 人有两种）。换测法造成的差异是实验设计给定的答案，不靠注入。"
  figure:
    file: mbdrc_fig1.jpg
    en: "Acera-Mateos 2026 Fig. 1, unmodified. Bottom left, \"DATA SCHEME\": 10x Multiome (11 samples, RNA + ATAC), 10x 3′ v3 (18), 10x 5′ v1 (4), all healthy cortex; the rest is the paper's integration framework, which we do not use. Genome Biol 2026, CC BY-NC-ND 4.0."
    zh: "Acera-Mateos 2026 Fig. 1，未改动。左下“DATA SCHEME”就是数据：10x Multiome 11 份（RNA + ATAC）、10x 3′ v3 18 份、10x 5′ v1 4 份，都是健康皮质；其余部分是论文比较整合方法的框架，我们不用。Genome Biol 2026，CC BY-NC-ND 4.0。"
  measured:
    en: "3′ single-cell RNA, 5′ single-cell RNA, and 10x multiome (snRNA + snATAC in the same nucleus)."
    zh: "3′ 单细胞 RNA、5′ 单细胞 RNA，以及 10x multiome（同一个核里测 snRNA + snATAC）。"
  samples:
    en: "19 healthy donors (the paper's term); normal tissue from the unaffected part of total nephrectomies, cut into about 25 biopsy-sized cores and kept in different media (CryoStor, RNAlater, OCT, liquid nitrogen). Cortex only, no medulla. Paper: 33 samples, 25 from donors with several samples and 8 from donors with one."
    zh: "19 名健康供体（论文的说法）；全肾切除时未受累部分的正常组织，切成约 25 个活检大小的组织块，分别用不同介质保存（CryoStor、RNAlater、OCT、液氮）。只有皮质，没有髓质。论文：33 份样本，25 份来自有多份样本的供体，8 份来自只有一份的供体。"
  label_detail:
    en: "Cell types, plus the assay and donor of every cell. Key number from the paper (3′ scRNA vs snRNA, 5 donors, 14 cell types): the assay explains a median 24% of expression variance, the donor about 3%."
    zh: "细胞类型，以及每个细胞的测法和供体。论文的关键数字（3′ 单细胞 vs 单核，5 名供体、14 种细胞）：表达差异里测法解释中位 24%，供体只解释约 3%。"
  issues:
    - en: "Healthy donors only, and cortex only."
      zh: "只有健康人，只有皮质。"
    - en: "Only 3 donors have all three assays; assay is also confounded with the tissue core and its preservation medium."
      zh: "只有 3 人三种测法都有；测法还和组织块、保存介质混在一起。"
  downloads:
    - {fmt: H5AD, what: {en: "cellxgene: integrated RNA, 97,125 cells (3′ / 5′ / multiome)", zh: "cellxgene：整合 RNA，97,125 细胞（3′ / 5′ / multiome）"}, size: "1.41 GB"}
    - {fmt: H5AD, what: {en: "cellxgene: multiome, 37,717 nuclei", zh: "cellxgene：multiome 37,717 核"}, size: "0.3 GB"}
    - {fmt: TSV, what: {en: "cellxgene: ATAC fragments + index", zh: "cellxgene：ATAC fragments + 索引"}, size: "4.1 GB"}
    - {fmt: tar.gz, what: {en: "Zenodo: all processed data + README", zh: "Zenodo：全部处理后数据 + README"}, size: "35.2 GB", url: "https://doi.org/10.5281/zenodo.18157241"}
  download_note:
    en: "The three cellxgene files (about 6 GB) are enough to start. Raw sequencing is at dbGaP phs004459 and needs an application."
    zh: "先下 cellxgene 的三个文件（约 6 GB）就够用。原始测序在 dbGaP phs004459，要申请。"
  use_in:
    anomaly-benchmark:
      en: "Task T2b: anything flagged as anomalous only because the same donor was measured with another assay is treated as a false alarm (our design choice). Also extends the healthy reference."
      zh: "任务 T2b：同一个人换了测法就被报成“异常”的，按误报处理（这是我们的设定）。也补充健康参考。"

- id: hoeft-2024
  name: "Hoeft 2024 · Four patients in one channel"
  name_zh: "Hoeft 2024 · 4 个病人混在一个通道"
  group: measurement
  species: human
  paper: hoeft-genotype-multiplexing-natcommun-2024
  cite: "Hoeft K et al. Nat Commun 2024;15:10612. doi:10.1038/s41467-024-54270-6"
  assays: [sn, genotype]
  scale: {en: "11,490 nuclei", zh: "11,490 核"}
  people: {en: "4 patients (frozen kidney biopsies)", zh: "4 名病人（冷冻肾活检）"}
  labels: {en: "donor by SNP; 250 genotype doublets (2.2%)", zh: "按 SNP 分出的供体；250 个基因型 doublet（2.2%）"}
  tissue: {en: "frozen kidney biopsies; diagnoses not reported", zh: "冷冻肾活检；没写诊断"}
  processed: {en: "GEO \"raw\" matrix is in fact filtered; FASTQ open, donor labels must be recomputed", zh: "GEO 上写“raw”的其实已过滤；FASTQ 公开，供体标签要重算"}
  access: open
  licence: "CC BY 4.0 (paper)"
  oneliner:
    en: "Four patients' kidney biopsies pooled in one 10x single-nucleus channel and separated by SNPs, so real ambient RNA and doublets can be computed. Our reading: the smallest and most direct such human kidney dataset we know of (Malone 2020 also has genotypes, but its raw data, including exomes, are about 700 GB in SRA)."
    zh: "4 名病人的冷冻肾活检混在一个 10x 单核通道里测，按 SNP 分出每个核来自谁，所以能算出真实的 ambient 和 doublet。我们的理解：这是我们知道的同类人肾数据里最小、最直接的（Malone 2020 也有基因型，但原始数据连同外显子在 SRA 里约 700 GB）。"
  figure:
    file: hoeft2024_fig2ij.jpg
    en: "Hoeft 2024 Fig. 2 i–j (kidney part, cropped). i: conceptual cartoon (the paper's term) of UMAPs of the pooled kidney nuclei (4 donors), coloured by cluster or by each method's donor assignment; j: share of each donor, doublets and unassigned nuclei per cluster. Most nuclei in the \"Low Quality\" and \"Mixed/Doublets\" clusters belong to a single donor. Nat Commun 2024, CC BY 4.0."
    zh: "Hoeft 2024 Fig. 2 i–j（肾部分，已截取）。i：示意图（论文原话为 conceptual cartoon），合并的肾脏核（4 名供体）的 UMAP，分别按聚类和按各方法的供体归属着色；j：每个簇里各病人、doublet 和未分配核的比例。注意“Low Quality”和“Mixed/Doublets”簇里大部分核其实只属于一个病人。Nat Commun 2024，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA (10x 3′ v3.1); bulk RNA-seq per patient, turned into genotype files (VCF)."
    zh: "单核 RNA（10x 3′ v3.1）；每个病人另有 bulk RNA-seq，做成了基因型文件（VCF）。"
  samples:
    en: "4 patients; the diagnoses are not reported."
    zh: "4 名病人；论文没有写诊断。"
  label_detail:
    en: "A nucleus carrying another donor's alleles is contaminated (ambient); a droplet with two genotypes is a doublet. Per-nucleus donor assignments are not public and must be recomputed from the raw data."
    zh: "核里出现别人的等位基因 = 外来污染（ambient）；一个液滴里有两种基因型 = doublet。每个核的供体分配没有公开，要从原始数据重算。"
  issues:
    - en: "The GEO matrix labelled \"raw\" is already filtered (no empty droplets); ambient RNA is not quantified in the paper."
      zh: "GEO 上写“raw”的矩阵其实已经过滤，没有空液滴；论文没有量化 ambient。"
    - en: "Only 4 people: enough for validation, not for main results."
      zh: "只有 4 人，只够做验证，不能当主结果。"
    - en: "Useful finding: the expression cluster \"Mixed/Doublets\" holds 4,488 nuclei (39%), but only 123 of them are genotype doublets (counted by us from the Source Data). Judging the cause of an anomaly from expression alone is unreliable."
      zh: "有用的发现：按表达聚出的“Mixed/Doublets”簇有 4,488 个核（39%），其中按基因型确认是 doublet 的只有 123 个（我们从 Source Data 算的）。只看表达，判断异常原因很不可靠。"
  downloads:
    - {fmt: MTX, what: {en: "GEO GSE247708: kidney 10x matrix (filtered, 11,490 nuclei)", zh: "GEO GSE247708：肾样本 10x 矩阵（已过滤，11,490 核）"}, size: "65 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE247708"}
    - {fmt: VCF, what: {en: "genotypes of the 4 kidney patients (from bulk RNA-seq)", zh: "4 个肾病人的基因型（来自 bulk RNA-seq）"}, size: "0.1–0.4 MB each", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE247708"}
    - {fmt: FASTQ, what: {en: "SRA PRJNA1040187, kidney run SRR29832267", zh: "SRA PRJNA1040187，肾样本 SRR29832267"}, size: "≈ 29 GB (SRA)", url: "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA1040187"}
  download_note:
    en: "To get ambient and doublet ground truth, rerun CellRanger and souporcell on the FASTQ with the VCFs."
    zh: "要得到 ambient / doublet 真值，得用 FASTQ + VCF 重跑 CellRanger 和 souporcell。"
  use_in:
    anomaly-benchmark:
      en: "Main line: real human-kidney doublet and ambient answers; the answer for external-validation task T2, and a check that our injected artifacts look real."
      zh: "主线：人肾真实的 doublet 和 ambient 答案；外部验证任务 T2 的答案，也用来检验我们注入的伪影像不像真的。"

- id: lake-2019
  name: "Lake 2019 · Same patients, different storage and processing"
  name_zh: "Lake 2019 · 同一个病人多种保存处理"
  group: measurement
  species: human
  paper: lake-snrna-pipeline-natcommun-2019
  cite: "Lake BB et al. Nat Commun 2019;10:2832. doi:10.1038/s41467-019-10861-2"
  assays: [sn]
  scale: {en: "17,659 nuclei (after QC)", zh: "17,659 核（QC 后）"}
  people: {en: "15 people (nephrectomies and deceased donors)", zh: "15 人（肾切除和死亡供体）"}
  labels: {en: "30 clusters; processing method per library", zh: "30 个簇；每个文库的处理方式"}
  access: open
  licence: "CC BY 4.0 (paper)"
  oneliner:
    en: "Kidney tissue from the same people stored and processed in different ways, to see what the processing itself changes."
    zh: "同一个人的肾组织用不同保存和处理方式测，看处理方式本身造成什么差异。"
  figure:
    file: lake2019_fig1ab.jpg
    en: "Lake 2019 Fig. 1 a–b (cropped). a: nephrectomy or donor tissue → whole-block freezing; cryosections then frozen / Wisconsin / RNAlater; fresh enzymatic dissociation → nuclei → snDrop-seq; b: 30 clusters of 17,659 nuclei (red clusters: marked by the authors as inflammation-, surgery- or stress-related). Nat Commun 2019, CC BY 4.0."
    zh: "Lake 2019 Fig. 1 a–b（已截取）。a：肾切除或供体组织 → 整块冷冻；冷冻切片后分别冷冻 / Wisconsin / RNAlater；新鲜酶解离 → 提取细胞核 → snDrop-seq；b：17,659 个核的 30 个簇（红字簇是作者标为炎症、手术、应激相关的）。Nat Commun 2019，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA with snDrop-seq (not 10x)."
    zh: "单核 RNA，用 snDrop-seq（不是 10x）。"
  samples:
    en: "15 people, tissue from nephrectomies and deceased donors; no biopsies. Example: deceased donor 3414, medulla — frozen 1,401, Wisconsin 1,533, RNAlater 3,102 nuclei."
    zh: "15 人，组织来自肾切除和死亡供体，没有活检。例：死亡供体 3414 的髓质，冷冻 1,401 / Wisconsin 1,533 / RNAlater 3,102 核。"
  label_detail:
    en: "Cluster annotations; the processing method of every nucleus can be recovered from the GEO sample metadata (checked). The authors found stress genes (FOS, FOSB, DNAJB1) after enzymatic dissociation, one cluster that \"likely represented a dissociation artifact\", and two clusters with high mitochondrial RNA \"consistent with … warm ischemia\"."
    zh: "簇注释；每个核的处理方式可以从 GEO 样本页的 metadata 恢复（已验证）。原文：酶解离出现应激基因（FOS、FOSB、DNAJB1），一个簇“likely represented a dissociation artifact”，两个簇线粒体偏高，“consistent with … warm ischemia”。"
  issues:
    - en: "Mitochondrial genes were removed from the public matrix; processing method is confounded with batch (date); small."
      zh: "公开矩阵删掉了线粒体基因；处理方式和批次（日期）混在一起；规模小。"
  downloads:
    - {fmt: TSV, what: {en: "GEO GSE121862: UMI matrix with cluster labels (17,659 nuclei)", zh: "GEO GSE121862：带簇注释的 UMI 矩阵（17,659 核）"}, size: "19 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE121862"}
    - {fmt: CSV, what: {en: "annotation of the 30 clusters", zh: "30 个簇的注释表"}, size: "1 KB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE121862"}
    - {fmt: FASTQ, what: {en: "SRA SRP166966 (92 runs)", zh: "SRA SRP166966（92 个 run）"}, size: "≈ 63 GB (SRA)"}
  download_note:
    en: "Small enough to download right away. Mitochondrial fractions need a re-alignment from FASTQ."
    zh: "很小，可以马上下。要算线粒体比例得从 FASTQ 重新比对。"
  use_in:
    anomaly-benchmark:
      en: "Under discussion: a small real answer to \"is a storage or processing change flagged as anomalous?\""
      zh: "讨论中：“保存 / 处理方式会不会被当成异常”的小规模真实答案。"

- id: malone-2020
  name: "Malone 2020 · Transplant donor and recipient"
  name_zh: "Malone 2020 · 移植肾供体 / 受者"
  group: measurement
  species: human
  paper: malone-transplant-chimerism-jasn-2020
  cite: "Malone AF et al. JASN 2020;31(9):1977–1986. doi:10.1681/ASN.2020030326"
  assays: [sc, genotype]
  scale: {en: "81,139 cells", zh: "81,139 细胞"}
  people: {en: "5 transplant biopsies", zh: "5 份移植肾活检"}
  labels: {en: "donor / recipient per cell (public file disagrees with the paper)", zh: "每个细胞来自供体还是受者（公开文件和论文对不上）"}
  access: open
  licence: "not CC"
  oneliner:
    en: "Kidney transplant biopsies where each cell is assigned to donor or recipient by genotype."
    zh: "移植肾活检，按供体和受者的基因型分出每个细胞来自谁。"
  measured:
    en: "Single-cell RNA (10x 5′); whole-exome sequencing of donors and recipients."
    zh: "单细胞 RNA（10x 5′）；供体和受者都做了全外显子测序。"
  samples:
    en: "5 kidney transplant biopsies: 3 with antibody-mediated rejection and 2 with a non-rejection cause of AKI; not native-kidney AKI / CKD."
    zh: "5 份移植肾活检：3 份抗体介导的排斥，2 份非排斥原因的 AKI；不是自体肾的 AKI / CKD。"
  label_detail:
    en: "Donor / recipient labels per cell. The public labels contradict the paper (macrophages: 4,715 / 312 in the file vs 1,229 / 3,798 in the paper), reason unknown."
    zh: "每个细胞的供体 / 受者标签。公开文件里的标签和论文对不上（巨噬细胞：文件 4,715 / 312，论文 1,229 / 3,798），原因未知。"
  issues:
    - en: "Doublets were removed by hand and by Demuxlet genotype calls (3–10.5% of cells); no doublet labels in the public file, no empty droplets; ambient RNA is not discussed."
      zh: "doublet 已被手工删掉，也按 Demuxlet 的基因型判定删过（占 3–10.5%）；公开文件里没有 doublet 标签，没有空液滴；全文没提 ambient。"
  downloads:
    - {fmt: CSV, what: {en: "GEO GSE145927: count tables of 7 biopsies (after QC)", zh: "GEO GSE145927：7 个活检的计数表（QC 后）"}, size: "247 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE145927"}
    - {fmt: CSV, what: {en: "per-cell metadata (donor / recipient, cell type, rejection)", zh: "每个细胞的标签表（供体 / 受者、细胞类型、排斥）"}, size: "2.1 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE145927"}
    - {fmt: FASTQ, what: {en: "SRA SRP250734 (36 runs, incl. exomes)", zh: "SRA SRP250734（36 个 run，含全外显子）"}, size: "≈ 693 GB (SRA)"}
  download_note:
    en: "JASN is not CC-licensed, so no original figure is shown. Using it would mean re-running from about 75–120 GB of raw data per single-cell sample (SRA)."
    zh: "JASN 不是 CC 授权，不放原图。要用就得从每个单细胞样本约 75–120 GB 的原始数据（SRA）重跑。"
  use_in:
    anomaly-benchmark:
      en: "Not used for now; human-kidney ground truth for artifacts relies on Hoeft 2024."
      zh: "暂不用；人肾伪影真值主要靠 Hoeft 2024。"

- id: janssen-2023
  name: "Janssen 2023 · Real ambient RNA in mouse kidney"
  name_zh: "Janssen 2023 · 小鼠肾真实 ambient"
  group: calibration
  species: mouse
  paper: janssen-ambient-noise-genomebiol-2023
  cite: "Janssen P et al. Genome Biol 2023;24:140. doi:10.1186/s13059-023-02978-x"
  assays: [sc, sn, genotype]
  scale: {en: "3 single-cell + 2 single-nucleus runs", zh: "3 次单细胞 + 2 次单核"}
  people: {en: "mice of 3 strains (CAST, BL6, SvImJ) pooled per run", zh: "3 个品系小鼠（CAST、BL6、SvImJ）混在一个通道"}
  labels: {en: "contamination fraction per cell (with 95% CI)", zh: "每个细胞的污染比例（含 95% 置信区间）"}
  tissue: {en: "healthy mouse kidney, 3 strains pooled per run", zh: "健康小鼠肾，3 个品系混在一个通道"}
  processed: {en: "raw (with empty droplets) + filtered matrices", zh: "raw（含空液滴）+ filtered 矩阵"}
  access: open
  licence: "CC BY 4.0"
  oneliner:
    en: "Kidneys of three mouse strains pooled in one channel; strain SNPs show how much foreign RNA each cell carries."
    zh: "3 个品系小鼠的肾混在一个通道，按品系基因型算出每个细胞被污染了多少。"
  figure:
    file: janssen2023_fig1.jpg
    en: "Janssen 2023 Fig. 1 A–D (cropped). A: kidneys of three strains pooled → single-cell / single-nucleus sequencing → strain SNPs assign each RNA → foreign RNA per CAST cell (red bar = background noise); B: cells per strain per run; C: strain-specific SNPs; D: informative sites per cell. Genome Biol 2023, CC BY 4.0."
    zh: "Janssen 2023 Fig. 1 A–D（已截取）。A：三个品系小鼠的肾混在一起 → 单细胞 / 单核测序 → 按品系 SNP 分出每条 RNA 来自谁 → 算出每个 CAST 细胞里的外来 RNA（红条 = 背景噪声）；B：每次实验各品系细胞数；C：品系特异 SNP 数；D：每个细胞覆盖的信息位点。Genome Biol 2023，CC BY 4.0。"
  measured:
    en: "Single-cell RNA ×3 (fresh) and single-nucleus RNA ×2 (RNAlater, frozen), 10x."
    zh: "单细胞 RNA 3 次（新鲜）+ 单核 RNA 2 次（RNAlater 冷冻），10x。"
  samples:
    en: "Healthy mice only."
    zh: "只有健康小鼠。"
  label_detail:
    en: "Median contamination: 35% and 17% in single-nucleus vs 11% and 3% in single-cell runs. The number of contaminating UMIs per cell depends only weakly on sequencing depth. Our reading: injection should therefore add an amount that does not scale with depth, rather than a fixed fraction."
    zh: "污染中位数：单核 35% / 17%，单细胞 11% / 3%。每个细胞的污染 UMI 数和测序深度只有弱相关。我们的理解：所以注入的量不该随深度按比例放大。"
  issues:
    - en: "Mouse, healthy only; all tools performed worst on nuc3, which the authors set aside."
      zh: "小鼠、只有健康；nuc3 上所有工具都最差，作者没再用。"
  downloads:
    - {fmt: zip, what: {en: "Zenodo 7328632: rep1 / rep2 / rep3 / nuc2 / nuc3", zh: "Zenodo 7328632：rep1 / rep2 / rep3 / nuc2 / nuc3 五个 zip"}, size: "3.4 GB total", url: "https://doi.org/10.5281/zenodo.7328632"}
    - {fmt: H5, what: {en: "in each zip: raw (with empty droplets) + filtered 10x matrices", zh: "每个 zip 里：raw（含空液滴）+ filtered 10x 矩阵"}, size: "163–226 MB"}
    - {fmt: RDS, what: {en: "in each zip: per-cell contamination fraction", zh: "每个 zip 里：每个细胞的污染比例"}, size: "70–310 KB"}
    - {fmt: H5, what: {en: "GEO GSE218853: the same raw / filtered h5 files", zh: "GEO GSE218853：同样的 raw / filtered h5"}, size: "1.1 GB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE218853"}
  download_note:
    en: "One of the smallest files, rep3.zip (0.31 GB), is a good first look at the format."
    zh: "rep3.zip 只有 0.31 GB（和 nuc3.zip 差不多，是最小的之一），可以先下来看格式。"
  use_in:
    anomaly-benchmark:
      en: "Calibrates how strong and what shape injected ambient RNA should have. Not a test set."
      zh: "定注入的 ambient 有多强、什么样子。不当测试集。"

- id: denisenko-2020
  name: "Denisenko 2020 · Dissociation and storage in mouse kidney"
  name_zh: "Denisenko 2020 · 小鼠肾解离与保存"
  group: calibration
  species: mouse
  paper: denisenko-dissociation-bias-genomebiol-2020
  cite: "Denisenko E et al. Genome Biol 2020;21:130. doi:10.1186/s13059-020-02048-6"
  assays: [sc, sn]
  scale: {en: "77,656 cells + 98,303 nuclei", zh: "77,656 细胞 + 98,303 核"}
  people: {en: "3 mice per arm", zh: "每组 3 只小鼠"}
  labels: {en: "dissociation / storage arm per sample", zh: "每个样本的解离 / 保存方式"}
  access: open
  licence: "CC BY 4.0"
  oneliner:
    en: "Mouse kidney dissociated at 37 °C or on ice, used fresh, cryopreserved or methanol-fixed, and profiled with three nucleus protocols: a controlled experiment human kidney data does not have."
    zh: "小鼠肾用 37 °C 和冰上冷解离、新鲜 / 冻存 / 甲醇固定、三种单核方法对比。人肾没有这样的对照实验。"
  figure:
    file: denisenko2020_fig1.jpg
    en: "Denisenko 2020 Fig. 1. A: 37 °C dissociation, B: cold dissociation, each fresh / methanol-fixed / cryopreserved for single-cell, plus bulk; C–E: three nucleus-extraction methods; F: whole-tissue bulk as reference. Genome Biol 2020, CC BY 4.0."
    zh: "Denisenko 2020 Fig. 1。A：37 °C 解离，B：冰上冷解离，各自再分新鲜 / 甲醇固定 / 冻存做单细胞，并做 bulk；C–E：三种提取细胞核的方法；F：整块组织 bulk 当参照。Genome Biol 2020，CC BY 4.0。"
  measured:
    en: "Single-cell and single-nucleus RNA (10x)."
    zh: "单细胞和单核 RNA（10x）。"
  samples:
    en: "Healthy mice, 3 per arm."
    zh: "健康小鼠，每组 3 只。"
  label_detail:
    en: "A 17-gene stress signature (Fos, Jun, Atf3, Egr1, heat-shock genes …); in 8 of 14 cell types stress rose only with 37 °C dissociation. After 37 °C dissociation podocytes fell to 0.03% (cold: 2.78%); after cryopreservation proximal tubule fell from about 63% to < 1%."
    zh: "17 个应激基因（Fos、Jun、Atf3、Egr1、热休克蛋白等）；14 种细胞里 8 种只在 37 °C 解离时应激升高。37 °C 解离后足细胞只剩 0.03%（冷解离 2.78%）；冻存后近端小管从约 63% 掉到 < 1%。"
  issues:
    - en: "Mouse genes must be mapped to human orthologues; batch is confounded with strain, sex and reagent version; processing is labelled per sample only."
      zh: "小鼠基因要换成人的同源基因；批次和品系、性别、试剂版本混在一起；处理方式只标到样本。"
  downloads:
    - {fmt: TXT, what: {en: "GEO GSE141115: 54 per-library gene × cell count tables (after QC)", zh: "GEO GSE141115：54 个文库各一个“基因 × 细胞”计数表（QC 后）"}, size: "250 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE141115"}
    - {fmt: FASTQ, what: {en: "SRA SRP233496 (336 runs)", zh: "SRA SRP233496（336 个 run）"}, size: "≈ 400 GB (SRA)"}
  download_note:
    en: "Cell-type labels are in the paper's Additional file 3."
    zh: "细胞类型标签在论文附件 Additional file 3。"
  use_in:
    anomaly-benchmark:
      en: "Evidence that dissociation stress can look like injury; the same FOS / JUN genes appear in Lake 2023's degenerative state. Later use, or calibration."
      zh: "说明“解离应激会被当成损伤”有实验证据，和 Lake 2023 degenerative 的 FOS / JUN 特征是同一类基因。以后再用，或做校准。"

