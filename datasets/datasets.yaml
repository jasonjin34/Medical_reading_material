# How to prepare each dataset: steps + loading code, all tested on 2026-10-26 in plain
# Python (anndata 0.13, scanpy 1.12, h5py, scipy, pandas, rdata 1.1; no R). Rendered as the
# "How to prepare" section of each dataset page. Availability of every file is checked
# without downloading by manuscripts/plan-a/notes/check_datasets.py.
prepare:
  lake-2023:
    steps:
      - en: "Download the cellxgene single-nucleus h5ad (1.57 GB): 172,847 nuclei × 28,813 genes. `X` is normalised; the integer counts are in `raw.X`."
        zh: "下载 cellxgene 的单核 h5ad（1.57 GB）：172,847 核 × 28,813 基因。`X` 是归一化后的值，整数计数在 `raw.X`。"
      - en: "The cellxgene file has cell types (`subclass.l1/l2`) but **no `state.l1/l2`**. Download the GEO metadata (19 MB) and join on the cell ID: all 172,847 IDs match."
        zh: "cellxgene 文件里有细胞类型（`subclass.l1/l2`），但**没有 `state.l1/l2`**。再下载 GEO 标签表（19 MB），按细胞 ID 合并：172,847 个全部对得上。"
      - en: "The cellxgene file leaves out 30,855 of GEO's 203,702 nuclei, including **all COVID-AKI patients** (19,678 nuclei) and the 3,364 nuclei without a state. If you need them, read GEO's count RDS instead (second code block)."
        zh: "cellxgene 版比 GEO 少了 30,855 个核（GEO 共 203,702 个），其中包括**全部 COVID-AKI 病人**（19,678 核）和 3,364 个没有状态标签的核。需要这些的话，改读 GEO 的计数 RDS（第二段代码）。"
      - en: "GEO's `.RDS` files are R sparse matrices (dgCMatrix). The `rdata` package reads them in Python; no R needed (SNARE2 RNA: 30,574 genes × 104,809 nuclei in about 4 s)."
        zh: "GEO 的 `.RDS` 是 R 的稀疏矩阵（dgCMatrix），用 `rdata` 包在 Python 里就能读，不用装 R（SNARE2 RNA：30,574 基因 × 104,809 核，约 4 秒）。"
    code: |
      import scanpy as sc, pandas as pd
      adata = sc.read_h5ad("lake2023_sn.h5ad")           # cellxgene single-nucleus file
      adata.X = adata.raw.X                               # integer counts
      meta = pd.read_csv("GSE183277_Kidney_Healthy-Injury_Cell_Atlas_snCv3_Metadata_03282022.txt.gz",
