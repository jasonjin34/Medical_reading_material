    zh: "17 个应激基因（Fos、Jun、Atf3、Egr1、热休克蛋白等）；14 种细胞里 8 种只在 37 °C 解离时应激升高。37 °C 解离后足细胞只剩 0.03%（冷解离 2.78%）；冻存后近端小管从约 63% 掉到 < 1%。"
  issues:
