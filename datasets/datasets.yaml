    en: "Kidney tissue from the same people stored and processed in different ways, to see what the processing itself changes."
    zh: "同一个人的肾组织用不同保存和处理方式测，看处理方式本身造成什么差异。"
  figure:
    file: lake2019_fig1ab.jpg
    en: "Lake 2019 Fig. 1 a–b (cropped). a: nephrectomy or donor tissue → whole-block freezing; cryosections then frozen / Wisconsin / RNAlater; fresh enzymatic dissociation → nuclei → snDrop-seq; b: 30 clusters of 17,659 nuclei (red clusters: marked by the authors as inflammation-, surgery- or stress-related). Nat Commun 2019, CC BY 4.0."
    zh: "Lake 2019 Fig. 1 a–b（已截取）。a：肾切除或供体组织 → 整块冷冻；冷冻切片后分别冷冻 / Wisconsin / RNAlater；新鲜酶解离 → 提取细胞核 → snDrop-seq；b：17,659 个核的 30 个簇（红字簇是作者标为炎症、手术、应激相关的）。Nat Commun 2019，CC BY 4.0。"
  measured:
    en: "Single-nucleus RNA with snDrop-seq (not 10x)."
    zh: "单核 RNA，用 snDrop-seq（不是 10x）。"
  samples:
    en: "15 people, tissue from nephrectomies and deceased donors; no biopsies. Example: patient 3414 medulla — frozen 1,401, Wisconsin 1,533, RNAlater 3,102 nuclei."
    zh: "15 人，组织来自肾切除和死亡供体，没有活检。例：病人 3414 的髓质，冷冻 1,401 / Wisconsin 1,533 / RNAlater 3,102 核。"
  label_detail:
    en: "Cluster annotations; the processing method of every nucleus can be recovered from the GEO sample metadata (checked). The authors found stress genes (FOS, FOSB, DNAJB1) after enzymatic dissociation, one cluster that \"likely represented a dissociation artifact\", and two clusters with high mitochondrial RNA \"consistent with … warm ischemia\"."
    zh: "簇注释；每个核的处理方式可以从 GEO 样本页的 metadata 恢复（已验证）。原文：酶解离出现应激基因（FOS、FOSB、DNAJB1），一个簇“likely represented a dissociation artifact”，两个簇线粒体偏高，“consistent with … warm ischemia”。"
  issues:
    - en: "Mitochondrial genes were removed from the public matrix; processing method is confounded with batch (date); small."
      zh: "公开矩阵删掉了线粒体基因；处理方式和批次（日期）混在一起；规模小。"
  downloads:
    - {fmt: TSV, what: {en: "GEO GSE121862: UMI matrix with cluster labels (17,659 nuclei)", zh: "GEO GSE121862：带簇注释的 UMI 矩阵（17,659 核）"}, size: "19 MB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE121862"}
    - {fmt: CSV, what: {en: "annotation of the 30 clusters", zh: "30 个簇的注释表"}, size: "1 KB", url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE121862"}
    - {fmt: FASTQ, what: {en: "SRA SRP166966 (92 runs)", zh: "SRA SRP166966（92 个 run）"}, size: "≈ 87 GB"}
