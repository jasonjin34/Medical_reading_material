gaps:
  - row: feature
    col: kidney
    note: {en: "Topic 1 baseline: kNN distance to healthy KPMP / Lake cells in a shared latent space.", zh: "课题 1 基线：在共享潜空间里算到健康 KPMP / Lake 细胞的 kNN 距离。"}
  - row: density
    col: kidney
    note: {en: "Density of healthy kidney cell states per cell type.", zh: "按细胞类型估计健康肾脏细胞状态的密度。"}
  - row: conformal
    col: kidney
    note: {en: "Calibrated per-cell anomaly p-values with FDR control.", zh: "给每个细胞校准过的异常 p 值，并控制 FDR。"}
  - row: crossmodal
    col: kidney
    note: {en: "Core idea of Topic 1: RNA / ATAC / Xenium / H&E disagreement separates artifacts from disease.", zh: "课题 1 的核心：用 RNA / ATAC / Xenium / H&E 之间的不一致，把伪影和疾病分开。"}
  - row: artifact
    col: kidney
    note: {en: "Artifact audit of the 95-biopsy Xenium + snRNA data.", zh: "对 95 例活检的 Xenium + snRNA 数据做伪影审计。"}
  - row: bench
    col: kidney
    note: {en: "KidneyAnomalyBench: expert-validated anomalies.", zh: "KidneyAnomalyBench：经专家验证的异常。"}

