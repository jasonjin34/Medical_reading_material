# Glossary slice B — spatial omics, single-cell & oncology/clinical
# Trilingual (English / 中文 / Deutsch). Definitions are original one-liners.

- id: spatial-transcriptomics
  en: Spatial transcriptomics
  zh: 空间转录组学
  de: Räumliche Transkriptomik
  domain: spatial-omics
  def_en: "A family of technologies that measure gene expression while preserving each cell's or spot's position within an intact tissue section."
  def_zh: "一类在保留细胞或位点在完整组织切片中位置的同时测量基因表达的技术。"
  def_de: "Eine Gruppe von Technologien, die die Genexpression messen und dabei die Position jeder Zelle oder jedes Spots im intakten Gewebeschnitt erhalten."
  tags: [spatial, omics, transcriptomics]
  seen_in: [spatial-natcommun-2024, spatial-biorxiv-2025, hest1k-2024]

- id: spatial-proteomics
  en: Spatial proteomics
  zh: 空间蛋白质组学
  de: Räumliche Proteomik
  domain: spatial-omics
  def_en: "The measurement of many proteins at once within their spatial context in a tissue, typically via multiplexed antibody imaging."
  def_zh: "在组织的空间背景下同时测量多种蛋白质,通常通过多重抗体成像实现。"
  def_de: "Die gleichzeitige Messung vieler Proteine im räumlichen Gewebekontext, meist über multiplexierte Antikörper-Bildgebung."
  tags: [spatial, omics, proteomics]
  seen_in: [virtual-tissue-2501]

- id: imaging-mass-cytometry
  en: Imaging mass cytometry (IMC)
  zh: 成像质谱流式(IMC)
  de: Bildgebende Massenzytometrie (IMC)
  domain: spatial-omics
  def_en: "A multiplexed imaging method that uses metal-tagged antibodies and mass spectrometry to map dozens of proteins across a tissue section at subcellular resolution."
  def_zh: "一种多重成像方法,利用金属标记抗体与质谱在亚细胞分辨率下绘制组织切片中数十种蛋白质。"
  def_de: "Eine multiplexierte Bildgebungsmethode, die metallmarkierte Antikörper und Massenspektrometrie nutzt, um Dutzende Proteine in einem Gewebeschnitt mit subzellulärer Auflösung zu kartieren."
  tags: [spatial, imaging, proteomics]
  seen_in: [virtual-tissue-2501]

- id: multiplexed-imaging
  en: Multiplexed imaging
  zh: 多重成像
  de: Multiplex-Bildgebung
  domain: spatial-omics
  def_en: "Imaging that captures many molecular channels (proteins or transcripts) in the same tissue section rather than just one or two stains."
  def_zh: "在同一组织切片中捕获多个分子通道(蛋白质或转录本)的成像,而非仅一两种染色。"
  def_de: "Bildgebung, die viele molekulare Kanäle (Proteine oder Transkripte) im selben Gewebeschnitt erfasst statt nur ein oder zwei Färbungen."
  tags: [spatial, imaging]
  seen_in: [virtual-tissue-2501, scrna-natmachintell-2026]

- id: visium
  en: Visium
  zh: Visium
  de: Visium
  domain: spatial-omics
  def_en: "A widely used 10x Genomics spatial-transcriptomics platform that captures gene expression on a grid of barcoded spots overlaid on a tissue slide."
  def_zh: "一种广泛使用的 10x Genomics 空间转录组平台,在覆盖组织切片的条形码位点阵列上捕获基因表达。"
  def_de: "Eine weit verbreitete Spatial-Transcriptomics-Plattform von 10x Genomics, die Genexpression auf einem Raster barcodierter Spots über einem Gewebeschnitt erfasst."
  tags: [spatial, platform, transcriptomics]
  seen_in: [spatial-natcommun-2024, hest1k-2024]

- id: slide-seq
  en: Slide-seq
  zh: Slide-seq
  de: Slide-seq
  domain: spatial-omics
  def_en: "A spatial-transcriptomics method that transfers tissue onto a bead array of positionally barcoded beads, giving near-cellular spatial resolution."
  def_zh: "一种将组织转移到带有位置条形码微珠阵列上的空间转录组方法,可达到接近单细胞的空间分辨率。"
  def_de: "Eine Spatial-Transcriptomics-Methode, die Gewebe auf ein Array positionsbarcodierter Beads überträgt und nahezu zelluläre räumliche Auflösung erreicht."
  tags: [spatial, platform, transcriptomics]
  seen_in: [spatial-natcommun-2024]

- id: stereo-seq
  en: Stereo-seq
  zh: Stereo-seq
  de: Stereo-seq
  domain: spatial-omics
  def_en: "A high-resolution spatial-transcriptomics platform using nanoball-patterned arrays that can resolve gene expression down to subcellular scale over large tissue areas."
  def_zh: "一种基于纳米球阵列的高分辨率空间转录组平台,可在大面积组织上将基因表达分辨到亚细胞尺度。"
  def_de: "Eine hochauflösende Spatial-Transcriptomics-Plattform mit Nanoball-Arrays, die Genexpression über große Gewebeflächen bis in den subzellulären Bereich auflöst."
  tags: [spatial, platform, transcriptomics]
  seen_in: [spatial-natcommun-2024]

- id: xenium
  en: Xenium
  zh: Xenium
  de: Xenium
  domain: spatial-omics
  def_en: "A 10x Genomics imaging-based platform that measures a targeted panel of transcripts in situ at subcellular resolution with single-cell segmentation."
  def_zh: "一种基于成像的 10x Genomics 平台,在亚细胞分辨率下原位测量目标转录本组合,并进行单细胞分割。"
  def_de: "Eine bildgebungsbasierte 10x-Genomics-Plattform, die ein gezieltes Transkript-Panel in situ mit subzellulärer Auflösung und Einzelzell-Segmentierung misst."
  tags: [spatial, platform, transcriptomics]
  seen_in: [spatial-biorxiv-2025, hest1k-2024]

- id: anomalous-tissue-domain
  en: Anomalous tissue domain (ATD)
  zh: 异常组织域(ATD)
  de: Anomale Gewebedomäne (ATD)
  domain: spatial-omics
  def_en: "A spatial region of a tissue whose molecular profile deviates from healthy reference tissue, typically because of disease and detected without predefined markers."
  def_zh: "组织中分子特征偏离健康参考组织的空间区域,通常由疾病导致,可在无预定义标记物的情况下被检出。"
  def_de: "Eine räumliche Gewebsregion, deren molekulares Profil vom gesunden Referenzgewebe abweicht, meist krankheitsbedingt und ohne vordefinierte Marker erkennbar."
  tags: [spatial, anomaly, disease]
  seen_in: [spatial-natcommun-2024]

- id: cellular-niche
  en: Cellular niche
  zh: 细胞微环境龛位(niche)
  de: Zelluläre Nische
  domain: spatial-omics
  def_en: "A local neighborhood of cells whose spatial composition and interactions define a distinct micro-environment within a tissue."
  def_zh: "由细胞的空间组成与相互作用界定的局部细胞邻域,构成组织内一个独特的微环境。"
  def_de: "Eine lokale Zellnachbarschaft, deren räumliche Zusammensetzung und Interaktionen ein eigenes Mikromilieu im Gewebe definieren."
  tags: [spatial, microenvironment]
  seen_in: [virtual-tissue-2501, spatial-biorxiv-2025]

- id: cell-segmentation
  en: Cell segmentation
  zh: 细胞分割
  de: Zellsegmentierung
  domain: spatial-omics
  def_en: "The image-analysis step of delineating individual cell boundaries so that molecular signals can be assigned to single cells."
  def_zh: "在图像分析中勾勒单个细胞边界的步骤,以便将分子信号归属到单个细胞。"
  def_de: "Der bildanalytische Schritt, einzelne Zellgrenzen abzugrenzen, damit molekulare Signale einzelnen Zellen zugeordnet werden können."
  tags: [spatial, imaging, segmentation]
  seen_in: [spatial-biorxiv-2025, hest1k-2024]

- id: single-cell-rna-seq
  en: Single-cell RNA sequencing (scRNA-seq)
  zh: 单细胞 RNA 测序(scRNA-seq)
  de: Einzelzell-RNA-Sequenzierung (scRNA-seq)
  domain: single-cell
  def_en: "A technique that profiles the transcriptome of individual cells, revealing cell-type heterogeneity that bulk sequencing averages away."
  def_zh: "一种对单个细胞转录组进行测序的技术,可揭示被批量测序平均掉的细胞类型异质性。"
  def_de: "Eine Technik, die das Transkriptom einzelner Zellen erfasst und die Zelltyp-Heterogenität sichtbar macht, die bei Bulk-Sequenzierung verloren geht."
  tags: [single-cell, transcriptomics]
  seen_in: [spatial-natcommun-2024, spatial-biorxiv-2025, scrna-natmachintell-2026]

- id: perturb-seq
  en: Perturb-seq
  zh: Perturb-seq
  de: Perturb-seq
  domain: single-cell
  def_en: "A screening method that pairs CRISPR perturbations with single-cell RNA sequencing to read out how each genetic perturbation reshapes the transcriptome."
  def_zh: "一种将 CRISPR 扰动与单细胞 RNA 测序结合的筛选方法,可读出每个基因扰动如何重塑转录组。"
  def_de: "Eine Screening-Methode, die CRISPR-Perturbationen mit Einzelzell-RNA-Sequenzierung koppelt, um zu erfassen, wie jede genetische Störung das Transkriptom verändert."
  tags: [single-cell, perturbation, crispr]
  seen_in: [virtual-cell-challenge]

- id: crispr-perturbation
  en: CRISPR perturbation
  zh: CRISPR 扰动
  de: CRISPR-Perturbation
  domain: single-cell
  def_en: "The deliberate silencing, activation, or editing of a target gene using CRISPR to observe the resulting change in cell state."
  def_zh: "利用 CRISPR 对目标基因进行定向沉默、激活或编辑,以观察由此引起的细胞状态变化。"
  def_de: "Das gezielte Stilllegen, Aktivieren oder Editieren eines Zielgens mittels CRISPR, um die daraus folgende Änderung des Zellzustands zu beobachten."
  tags: [single-cell, perturbation, crispr]
  seen_in: [virtual-cell-challenge]

- id: virtual-cell
  en: Virtual cell
  zh: 虚拟细胞
  de: Virtuelle Zelle
  domain: single-cell
  def_en: "A computational model of a cell that predicts how its molecular state responds to perturbations, enabling experiments to be run in silico."
  def_zh: "细胞的计算模型,可预测其分子状态对扰动的响应,从而在计算机中开展实验。"
  def_de: "Ein rechnerisches Zellmodell, das vorhersagt, wie der molekulare Zustand einer Zelle auf Störungen reagiert, und Experimente in silico ermöglicht."
  tags: [single-cell, modeling, perturbation]
  seen_in: [virtual-cell-challenge]

- id: perturbation-response-prediction
  en: Perturbation-response prediction
  zh: 扰动响应预测
  de: Vorhersage der Perturbationsantwort
  domain: single-cell
  def_en: "The task of predicting how a cell's gene expression will shift after a given genetic or drug perturbation, often for unseen conditions."
  def_zh: "预测给定基因或药物扰动后细胞基因表达如何变化的任务,通常针对未见过的条件。"
  def_de: "Die Aufgabe vorherzusagen, wie sich die Genexpression einer Zelle nach einer bestimmten genetischen oder medikamentösen Störung verschiebt, oft für ungesehene Bedingungen."
  tags: [single-cell, perturbation, prediction]
  seen_in: [virtual-cell-challenge, scrna-natmachintell-2026]

- id: gene-expression-signature
  en: Gene-expression signature
  zh: 基因表达签名
  de: Genexpressionssignatur
  domain: single-cell
  def_en: "A defined set of genes whose coordinated expression levels mark a particular cell state, disease, or treatment response."
  def_zh: "一组特定基因,其协同表达水平可标志某种细胞状态、疾病或治疗响应。"
  def_de: "Eine definierte Gruppe von Genen, deren koordinierte Expressionsniveaus einen bestimmten Zellzustand, eine Krankheit oder eine Therapieantwort kennzeichnen."
  tags: [single-cell, biomarker, expression]
  seen_in: [virtual-tissue-2501, spatial-biorxiv-2025]

- id: cell-state
  en: Cell state
  zh: 细胞状态
  de: Zellzustand
  domain: single-cell
  def_en: "The transient functional condition of a cell — such as activated, exhausted, or proliferating — layered on top of its stable cell-type identity."
  def_zh: "细胞在其稳定的细胞类型身份之上所处的、可变的功能状态,如激活、耗竭或增殖。"
  def_de: "Der vorübergehende funktionelle Zustand einer Zelle — etwa aktiviert, erschöpft oder proliferierend — der ihrer stabilen Zelltyp-Identität überlagert ist."
  tags: [single-cell, phenotype]
  seen_in: [spatial-biorxiv-2025, virtual-cell-challenge]

- id: tumor-microenvironment
  en: Tumor microenvironment (TME)
  zh: 肿瘤微环境(TME)
  de: Tumormikromilieu (TME)
  domain: oncology-clinical
  def_en: "The ecosystem of immune, stromal, and vascular cells surrounding a tumor that shapes its growth and its response to therapy."
  def_zh: "环绕肿瘤的免疫、基质与血管细胞所构成的生态系统,影响肿瘤生长及其对治疗的响应。"
  def_de: "Das Ökosystem aus Immun-, Stroma- und Gefäßzellen rund um einen Tumor, das dessen Wachstum und Therapieantwort prägt."
  tags: [oncology, microenvironment, immune]
  seen_in: [spatial-biorxiv-2025, virtual-tissue-2501]

- id: tertiary-lymphoid-structure
  en: Tertiary lymphoid structure (TLS)
  zh: 三级淋巴结构(TLS)
  de: Tertiäre lymphoide Struktur (TLS)
  domain: oncology-clinical
  def_en: "An organized aggregate of immune cells that forms in chronically inflamed or tumor tissue and often associates with better anti-tumor immunity."
  def_zh: "在慢性炎症或肿瘤组织中形成的有序免疫细胞聚集体,常与更强的抗肿瘤免疫相关。"
  def_de: "Ein organisiertes Aggregat von Immunzellen, das in chronisch entzündetem oder Tumorgewebe entsteht und oft mit besserer Antitumor-Immunität einhergeht."
  tags: [oncology, immune, structure]
  seen_in: [spatial-biorxiv-2025]

- id: t-cell-exhaustion
  en: T-cell exhaustion
  zh: T 细胞耗竭
  de: T-Zell-Erschöpfung
  domain: oncology-clinical
  def_en: "A dysfunctional state in which chronically stimulated T cells lose their killing capacity and up-regulate inhibitory checkpoint markers."
  def_zh: "一种功能失调状态:长期受刺激的 T 细胞丧失杀伤能力并上调抑制性检查点标志物。"
  def_de: "Ein dysfunktionaler Zustand, in dem chronisch stimulierte T-Zellen ihre zytotoxische Kapazität verlieren und hemmende Checkpoint-Marker hochregulieren."
  tags: [oncology, immune, t-cell]
  seen_in: [spatial-biorxiv-2025]

- id: immune-checkpoint-blockade
  en: Immune checkpoint blockade (ICB)
  zh: 免疫检查点阻断(ICB)
  de: Immun-Checkpoint-Blockade (ICB)
  domain: oncology-clinical
  def_en: "A cancer immunotherapy that blocks inhibitory receptors such as PD-1 or PD-L1 to release the brakes on anti-tumor T cells."
  def_zh: "一种癌症免疫治疗,通过阻断 PD-1 或 PD-L1 等抑制性受体来解除抗肿瘤 T 细胞的抑制。"
  def_de: "Eine Krebs-Immuntherapie, die hemmende Rezeptoren wie PD-1 oder PD-L1 blockiert, um die Bremsen der Antitumor-T-Zellen zu lösen."
  tags: [oncology, immunotherapy, immune]
  seen_in: [spatial-biorxiv-2025, virtual-tissue-2501]

- id: concordance-index
  en: Concordance index (C-index)
  zh: 一致性指数(C-index)
  de: Konkordanzindex (C-Index)
  domain: oncology-clinical
  def_en: "A metric for survival models that measures how often the model correctly ranks which of two patients experiences the event sooner."
  def_zh: "用于生存模型的指标,衡量模型正确判断两名患者中谁更早发生事件的比例。"
  def_de: "Eine Kennzahl für Überlebensmodelle, die misst, wie oft das Modell korrekt einordnet, welcher von zwei Patienten das Ereignis früher erlebt."
  tags: [oncology, survival, metric]
  seen_in: [virtual-tissue-2501, pathomics-npjpo-2026]

- id: triple-negative-breast-cancer
  en: Triple-negative breast cancer (TNBC)
  zh: 三阴性乳腺癌(TNBC)
  de: Triple-negatives Mammakarzinom (TNBC)
  domain: oncology-clinical
  def_en: "An aggressive breast-cancer subtype lacking estrogen, progesterone, and HER2 receptors, which limits targeted-therapy options."
  def_zh: "一种侵袭性乳腺癌亚型,缺乏雌激素、孕激素和 HER2 受体,限制了靶向治疗选择。"
  def_de: "Ein aggressiver Brustkrebs-Subtyp ohne Östrogen-, Progesteron- und HER2-Rezeptoren, was zielgerichtete Therapieoptionen einschränkt."
  tags: [oncology, breast-cancer, subtype]
  seen_in: [virtual-tissue-2501]

- id: pathological-complete-response
  en: Pathological complete response (pCR)
  zh: 病理完全缓解(pCR)
  de: Pathologische Komplettremission (pCR)
  domain: oncology-clinical
  def_en: "The absence of any residual invasive tumor in tissue examined after neoadjuvant therapy, a favorable predictor of long-term outcome."
  def_zh: "新辅助治疗后所检组织中不存在任何残留浸润性肿瘤,是长期预后良好的指标。"
  def_de: "Das Fehlen jeglichen residualen invasiven Tumors im nach neoadjuvanter Therapie untersuchten Gewebe, ein günstiger Prädiktor für den Langzeitverlauf."
  tags: [oncology, treatment-response, outcome]
  seen_in: [virtual-tissue-2501]

- id: overall-survival
  en: Overall survival (OS)
  zh: 总生存期(OS)
  de: Gesamtüberleben (OS)
  domain: oncology-clinical
  def_en: "The length of time from diagnosis or treatment start until death from any cause, a primary endpoint in cancer studies."
  def_zh: "从确诊或开始治疗到因任何原因死亡的时间长度,是癌症研究的主要终点。"
  def_de: "Die Zeitspanne von Diagnose oder Therapiebeginn bis zum Tod jeglicher Ursache, ein primärer Endpunkt in Krebsstudien."
  tags: [oncology, survival, outcome]
  seen_in: [pathomics-npjpo-2026]

- id: pathomics-signature
  en: Pathomics signature
  zh: 病理组学签名
  de: Pathomics-Signatur
  domain: oncology-clinical
  def_en: "A prognostic index built from quantitative features that deep-learning models extract directly from digitized histopathology slides."
  def_zh: "由深度学习模型直接从数字病理切片中提取的定量特征构建的预后指标。"
  def_de: "Ein prognostischer Index aus quantitativen Merkmalen, die Deep-Learning-Modelle direkt aus digitalisierten Histopathologie-Schnitten extrahieren."
  tags: [oncology, pathology, prognosis]
  seen_in: [pathomics-npjpo-2026]

- id: whole-slide-image
  en: Whole-slide image (WSI)
  zh: 全切片图像(WSI)
  de: Gesamtschnittbild (WSI)
  domain: oncology-clinical
  def_en: "A high-resolution digital scan of an entire histopathology glass slide, often gigapixel-sized, used for computational pathology."
  def_zh: "对整张组织病理玻片进行的高分辨率数字扫描,常达十亿像素级,用于计算病理学。"
  def_de: "Ein hochauflösender digitaler Scan eines gesamten Histopathologie-Objektträgers, oft im Gigapixel-Bereich, für die computergestützte Pathologie."
  tags: [pathology, imaging, histology]
  seen_in: [hest1k-2024, pathomics-npjpo-2026]

- id: foundation-model
  en: Foundation model
  zh: 基础模型
  de: Foundation Model
  domain: general
  def_en: "A large model pretrained on broad unlabeled data that can be adapted to many downstream tasks, often with little or no fine-tuning."
  def_zh: "在大量无标注数据上预训练的大型模型,可适配到多种下游任务,常只需很少甚至无需微调。"
  def_de: "Ein großes, auf breiten unmarkierten Daten vortrainiertes Modell (Foundation Model), das sich mit wenig oder ohne Feinabstimmung an viele nachgelagerte Aufgaben anpassen lässt."
  tags: [ml, pretraining]
  seen_in: [virtual-tissue-2501, hest1k-2024]

- id: optimal-transport
  en: Optimal transport
  zh: 最优传输
  de: Optimaler Transport
  domain: general
  def_en: "A mathematical framework for finding the least-cost way to morph one probability distribution into another, used here to map cell populations between conditions."
  def_zh: "一种寻找以最小代价将一个概率分布变换为另一个分布的数学框架,此处用于在不同条件间映射细胞群体。"
  def_de: "Ein mathematischer Rahmen, um die kostengünstigste Umformung einer Wahrscheinlichkeitsverteilung in eine andere zu finden, hier zur Abbildung von Zellpopulationen zwischen Bedingungen genutzt."
  tags: [ml, math, distribution]
  seen_in: [virtual-tissue-2501, scrna-natmachintell-2026]

- id: flow-matching
  en: Flow matching
  zh: 流匹配
  de: Flow Matching
  domain: general
  def_en: "A generative-modeling technique that learns a continuous transformation, or flow, carrying samples from a simple distribution to the target data distribution."
  def_zh: "一种生成建模技术,学习一条连续变换(流),将样本从简单分布输运到目标数据分布。"
  def_de: "Eine generative Modellierungstechnik, die eine kontinuierliche Transformation (einen Fluss) lernt, der Stichproben von einer einfachen Verteilung zur Zielverteilung führt."
  tags: [ml, generative]
  seen_in: [spatial-biorxiv-2025, virtual-cell-challenge]

- id: masked-autoencoder
  en: Masked autoencoder (MAE)
  zh: 掩码自编码器(MAE)
  de: Maskierter Autoencoder (MAE)
  domain: general
  def_en: "A self-supervised model trained to reconstruct deliberately hidden parts of its input, yielding representations useful for downstream tasks."
  def_zh: "一种自监督模型,通过重建被刻意遮蔽的输入部分进行训练,从而得到对下游任务有用的表征。"
  def_de: "Ein selbstüberwachtes Modell, das darauf trainiert wird, absichtlich verdeckte Teile seiner Eingabe zu rekonstruieren, und so für nachgelagerte Aufgaben nützliche Repräsentationen liefert."
  tags: [ml, self-supervised, reconstruction]
  seen_in: [virtual-tissue-2501]

- id: anomaly-detection
  en: Anomaly detection
  zh: 异常检测
  de: Anomalieerkennung
  domain: general
  def_en: "The task of identifying data points or regions that deviate from a learned model of normal, often by flagging high reconstruction error."
  def_zh: "识别偏离已学习的正常模型的数据点或区域的任务,常通过标记较高的重建误差实现。"
  def_de: "Die Aufgabe, Datenpunkte oder Regionen zu identifizieren, die von einem gelernten Normalmodell abweichen, oft durch Markieren hoher Rekonstruktionsfehler."
  tags: [ml, anomaly]
  seen_in: [spatial-natcommun-2024]

- id: multiple-instance-learning
  en: Multiple-instance learning (MIL)
  zh: 多示例学习(MIL)
  de: Multiple-Instance-Learning (MIL)
  domain: general
  def_en: "A weakly-supervised paradigm where a single label is attached to a whole bag of instances, letting a slide-level label train on many image patches."
  def_zh: "一种弱监督范式,将单一标签赋予整个示例袋,使切片级标签能在众多图像块上进行训练。"
  def_de: "Ein schwach überwachtes Paradigma, bei dem ein einzelnes Label einem ganzen Bündel von Instanzen zugeordnet wird, sodass ein Schnitt-Label über viele Bildausschnitte trainiert."
  tags: [ml, weakly-supervised, pathology]
  seen_in: [pathomics-npjpo-2026]

# ---------------------------------------------------------------------------
# Single-cell & spatial modalities, omics QC artifacts, nephrology clinical
# (added 2026-09-03 — distilled from the modality close-reading notes)
# ---------------------------------------------------------------------------

- id: snrna-seq
  en: Single-nucleus RNA-seq (snRNA-seq)
  zh: 单核 RNA 测序(snRNA-seq)
  de: Einzelkern-RNA-Sequenzierung (snRNA-seq)
  domain: single-cell
  def_en: "Dissociates tissue down to individual nuclei and sequences the RNA in each, giving genome-wide expression per nucleus at the cost of losing every cell's position in the tissue."
  def_zh: "把组织解离成单个细胞核并分别测其 RNA,得到每个核的全基因组表达,代价是彻底丢失细胞原本在组织中的位置。"
  def_de: "Zerlegt Gewebe in einzelne Zellkerne und sequenziert deren RNA; liefert genomweite Expression pro Kern, verliert dabei aber jede räumliche Position der Zellen."
  tags: [single-cell, transcriptomics, modality]
  seen_in: []

- id: snatac-seq
  en: Single-nucleus ATAC-seq (snATAC-seq)
  zh: 单核 ATAC 测序(snATAC-seq)
  de: Einzelkern-ATAC-Sequenzierung (snATAC-seq)
  domain: single-cell
  def_en: "Uses a transposase that cuts only unpacked DNA to map which genomic regions are open per nucleus, revealing which genes are permitted to be expressed rather than which currently are."
  def_zh: "用只能切开松散 DNA 的转座酶,逐核绘制哪些基因组区域处于开放状态,揭示哪些基因「有资格」表达,而非当前正在表达什么。"
  def_de: "Nutzt eine Transposase, die nur ungepackte DNA schneidet, um pro Zellkern offene Genomregionen zu kartieren; zeigt, welche Gene exprimiert werden dürfen, nicht welche es gerade werden."
  tags: [single-cell, epigenomics, modality]
  seen_in: []

- id: chromatin-accessibility
  en: Chromatin accessibility
  zh: 染色质开放性
  de: Chromatin-Zugänglichkeit
  domain: single-cell
  def_en: "How physically reachable a stretch of DNA is for transcription machinery; tightly packed regions are effectively switched off, loosened ones are available for expression."
  def_zh: "一段 DNA 对转录机器的物理可及程度;缠绕紧密的区域等同于被关闭,松开的区域才可能被表达。"
  def_de: "Wie physisch erreichbar ein DNA-Abschnitt für die Transkriptionsmaschinerie ist; dicht gepackte Regionen sind faktisch abgeschaltet, gelockerte stehen zur Expression bereit."
  tags: [epigenomics, regulation]
  seen_in: []

- id: atac-peak
  en: ATAC peak
  zh: ATAC 峰
  de: ATAC-Peak
  domain: single-cell
  def_en: "A genomic interval where transposase cut sites pile up across many nuclei, defining a region of open chromatin and forming the row dimension of the peak-by-cell matrix."
  def_zh: "转座酶切点在众多细胞核中反复堆积的基因组区间,标定一段开放染色质,并构成「峰 × 细胞」矩阵的行维度。"
  def_de: "Ein genomisches Intervall, in dem sich Transposase-Schnittstellen über viele Zellkerne häufen; definiert offenes Chromatin und bildet die Zeilendimension der Peak-Zell-Matrix."
  tags: [epigenomics, data-structure]
  seen_in: []

- id: tf-motif
  en: Transcription-factor motif
  zh: 转录因子结合基序
  de: Transkriptionsfaktor-Motiv
  domain: single-cell
  def_en: "The short DNA sequence pattern a transcription factor recognizes; enrichment of a motif inside accessible regions is the standard evidence for inferring which regulator drives a cell state."
  def_zh: "转录因子识别的短 DNA 序列模式;开放区域中某基序的富集,是推断哪个调控因子驱动了某种细胞状态的标准证据。"
  def_de: "Das kurze DNA-Sequenzmuster, das ein Transkriptionsfaktor erkennt; die Anreicherung eines Motivs in zugänglichen Regionen ist der Standardbeleg dafür, welcher Regulator einen Zellzustand antreibt."
  tags: [epigenomics, regulation, inference]
  seen_in: []

- id: multiome
  en: Multiome (joint RNA + ATAC)
  zh: Multiome(RNA 与 ATAC 同核联测)
  de: Multiome (gemeinsam RNA + ATAC)
  domain: single-cell
  def_en: "An assay that measures transcription and chromatin accessibility in the very same nucleus, pairing 'what is expressed' with 'what is permitted' without having to match cells across separate runs."
  def_zh: "在同一个细胞核里同时测转录与染色质开放性的实验,把「表达了什么」与「允许表达什么」直接配对,无需在两批细胞之间猜对应关系。"
  def_de: "Ein Assay, der Transkription und Chromatin-Zugänglichkeit im selben Zellkern misst und so „was exprimiert wird“ direkt mit „was erlaubt ist“ paart, ohne Zellen zwischen Läufen zuordnen zu müssen."
  tags: [single-cell, multi-omics, assay]
  seen_in: []

- id: multi-omics
  en: Multi-omics
  zh: 多组学
  de: Multi-Omics
  domain: single-cell
  def_en: "Measuring several molecular layers — for example the epigenome and the transcriptome — on the same samples so that the layers can corroborate or contradict one another."
  def_zh: "在同一批样本上测量多个分子层(例如表观组与转录组),使各层之间可以互相印证或互相矛盾。"
  def_de: "Die Messung mehrerer molekularer Ebenen — etwa Epigenom und Transkriptom — an denselben Proben, sodass sich die Ebenen gegenseitig bestätigen oder widersprechen können."
  tags: [multi-omics, integration]
  seen_in: [histo-sciencedirect-2026]

- id: mofa
  en: Multi-Omics Factor Analysis (MOFA)
  zh: 多组学因子分析(MOFA)
  de: Multi-Omics-Faktoranalyse (MOFA)
  domain: single-cell
  def_en: "An unsupervised integration method that compresses several differently shaped omics matrices into a shared set of latent factors, surfacing variation that co-varies across layers."
  def_zh: "一种无监督整合方法,把形状各异的多个组学矩阵压缩到一组共享潜因子上,使跨层共变的变异显形。"
  def_de: "Eine unüberwachte Integrationsmethode, die mehrere unterschiedlich geformte Omics-Matrizen in gemeinsame latente Faktoren komprimiert und schichtübergreifend ko-variierende Variation sichtbar macht."
  tags: [integration, unsupervised, multi-omics]
  seen_in: []

- id: doublet
  en: Doublet
  zh: 双细胞假象(doublet)
  de: Doublet
  domain: single-cell
  def_en: "A technical artifact where two cells or nuclei are captured under one barcode and analysed as a single cell, producing a chimeric expression profile that can masquerade as a novel cell state."
  def_zh: "两个细胞或细胞核被同一条形码捕获、当作一个细胞分析的技术假象,产生嵌合表达谱,可能被误认为一种新的细胞状态。"
  def_de: "Ein technisches Artefakt, bei dem zwei Zellen bzw. Zellkerne unter einem Barcode erfasst und als eine Zelle ausgewertet werden; das chimäre Expressionsprofil kann einen neuen Zellzustand vortäuschen."
  tags: [qc, artifact, single-cell]
  seen_in: []

- id: ambient-rna
  en: Ambient RNA
  zh: 游离 RNA 污染(ambient RNA)
  de: Ambient-RNA
  domain: single-cell
  def_en: "Free-floating transcripts released by lysed cells that get counted into other droplets, adding a background signal that makes unrelated cells look alike."
  def_zh: "破裂细胞释放的游离转录本被计入其他液滴,形成背景信号,使本不相关的细胞看起来彼此相似。"
  def_de: "Frei schwebende Transkripte lysierter Zellen, die in andere Tröpfchen mitgezählt werden und ein Hintergrundsignal erzeugen, das unverwandte Zellen ähnlich erscheinen lässt."
  tags: [qc, artifact, single-cell]
  seen_in: []

- id: technical-dropout
  en: Technical dropout (false zero)
  zh: 技术性丢失(假零)
  de: Technischer Dropout (falsche Null)
  domain: single-cell
  def_en: "A zero in a count matrix caused by failed capture rather than absent expression; because true and false zeros are indistinguishable, sparsity is both biology and noise at once."
  def_zh: "计数矩阵中因捕获失败而非真的不表达所产生的零;由于真零与假零无法区分,稀疏性同时既是生物学也是噪声。"
  def_de: "Eine Null in der Zählmatrix, die durch fehlgeschlagene Erfassung statt fehlender Expression entsteht; da echte und falsche Nullen ununterscheidbar sind, ist Sparsity zugleich Biologie und Rauschen."
  tags: [qc, artifact, sparsity]
  seen_in: []

- id: kidney-biopsy
  en: Kidney biopsy
  zh: 肾活检
  de: Nierenbiopsie
  domain: nephrology-clinical
  def_en: "A needle-extracted core of renal tissue a few millimetres long, the shared raw material every kidney modality reads in its own way — stained, dissociated or profiled in situ."
  def_zh: "用穿刺针取出的数毫米长肾组织条,是所有肾脏 modality 共同的原材料——或染色、或解离、或原位测序,各读各的。"
  def_de: "Ein per Nadel entnommener, wenige Millimeter langer Nierengewebezylinder — das gemeinsame Rohmaterial, das jede Nieren-Modalität auf ihre Weise ausliest: gefärbt, dissoziiert oder in situ profiliert."
  tags: [clinical, tissue, nephrology]
  seen_in: []

- id: egfr-kidney-function
  en: Estimated glomerular filtration rate (eGFR)
  zh: 估算肾小球滤过率(eGFR)
  de: Geschätzte glomeruläre Filtrationsrate (eGFR)
  domain: nephrology-clinical
  def_en: "The standard blood-derived estimate of how much the kidneys filter per minute; its trajectory over years is the clinical outcome any prognostic kidney model is ultimately judged against."
  def_zh: "由血液指标估算的肾脏每分钟滤过量,是肾功能的标准度量;其多年的变化轨迹,是任何肾脏预后模型最终要对照的临床结局。"
  def_de: "Der blutbasierte Standardschätzwert dafür, wie viel die Nieren pro Minute filtern; sein Verlauf über Jahre ist das klinische Ergebnis, an dem sich jedes prognostische Nierenmodell messen lassen muss."
  tags: [clinical, outcome, nephrology]
  seen_in: []

- id: chronic-kidney-disease
  en: Chronic kidney disease (CKD)
  zh: 慢性肾脏病(CKD)
  de: Chronische Nierenerkrankung (CKD)
  domain: nephrology-clinical
  def_en: "Progressive, largely irreversible loss of kidney function over months to years; the non-tumor disease setting where computational pathology benchmarks are conspicuously absent."
  def_zh: "肾功能在数月至数年间进行性、基本不可逆的丧失;正是在这类非肿瘤疾病场景下,计算病理学的基准明显缺席。"
  def_de: "Fortschreitender, weitgehend irreversibler Verlust der Nierenfunktion über Monate bis Jahre; genau jenes nicht-onkologische Krankheitsfeld, in dem Benchmarks der computationalen Pathologie auffällig fehlen."
  tags: [clinical, disease, nephrology]
  seen_in: []

- id: interstitial-fibrosis
  en: Interstitial fibrosis
  zh: 间质纤维化
  de: Interstitielle Fibrose
  domain: nephrology-clinical
  def_en: "Scar-tissue accumulation between the functional units of an organ, scored routinely on kidney biopsies (read on several stains such as H&E, PAS and trichrome) as a coarse prognostic marker and the canonical target of 'detect the diseased region' tasks."
  def_zh: "器官功能单位之间瘢痕组织的堆积,常规在肾活检上评分(结合 H&E、PAS、三色染色等多种染色)作为粗略的预后标志,也是「检出病变区域」类任务的经典目标。"
  def_de: "Ansammlung von Narbengewebe zwischen den funktionellen Einheiten eines Organs; wird routinemäßig an Nierenbiopsien (anhand mehrerer Färbungen wie H&E, PAS und Trichrom) als grober prognostischer Marker bewertet und ist das klassische Ziel von „Erkenne die erkrankte Region“-Aufgaben."
  tags: [clinical, histology, nephrology]
  seen_in: [pathomics-npjpo-2026, spatial-natcommun-2024]
