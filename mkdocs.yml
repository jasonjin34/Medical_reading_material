site_name: Medical Reading Material
site_description: Anomaly-detection-based virtual tissue modelling
theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
  - mermaid2
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
nav:
  - Home: index.md
  - Literature review: literature-review.md
  - Relationships: relationships.md
  - Papers:
    - Single-cell:
      - "Conditional Monge Gap enables generalizable single-cell perturbation modelling": papers/scrna-natmachintell-2026/index.md
    - Spatial transcriptomics:
      - "Mapping and reprogramming human tissue microenvironments with MintFlow": papers/spatial-biorxiv-2025/index.md
      - "Detecting anomalous anatomic regions in spatial transcriptomics with STANDS": papers/spatial-natcommun-2024/index.md
    - Virtual tissues:
      - "AI-powered virtual tissues from spatial proteomics for clinical diagnostics and biomedical discovery": papers/virtual-tissue-2501/index.md
    - Histopathology:
      - "AI-Based Anomaly Detection for Clinical-Grade Histopathological Diagnostics": papers/histo-nejmai-2024/index.md
      - "Spatial biomarker discovery via interpretable semantic learning in histopathology": papers/histo-sciencedirect-2026/index.md
      - "Boehringer-Ingelheim/anomaly-detection-in-histology": papers/histo-anomaly-bi-repo/index.md
      - "Pathology-Informed Latent Diffusion Model for Anomaly Detection in Lymph Node Metastasis": papers/histo-miccai-2025/index.md
    - Foundation models:
      - "A Generative Foundation Model for Multimodal Histopathology": papers/fm-arxiv-2604/index.md
      - "HEST-1k: A Dataset for Spatial Transcriptomics and Histology Image Analysis": papers/hest1k-2024/index.md
      - "MahmoodLab/UNI2-h": papers/uni2-h-model/index.md
      - "A foundation model for clinical-grade computational pathology and rare cancers detection": papers/virchow-2024/index.md
    - Pathology:
      - "A Deep Learning-Based Pathomics Methodology for Quantifying and Characterizing Nucleated Cells in the Bone Marrow Microenvironment": papers/pathomics-blood-2023/index.md
      - "Deep learning-based pathomics signature predicts prognosis and treatment response in gastric cancer: a multicenter retrospective study": papers/pathomics-npjpo-2026/index.md
      - "Cassie07/PathOmics": papers/pathomics-repo/index.md
    - Imaging:
      - "An ECG biomarker for sudden cardiac death discovered with deep learning": papers/imaging-nature-2026/index.md
      - "An artificial intelligence model to detect abnormal ejection fraction from non-contrast chest computed tomography: the CT–LVEF study": papers/imaging-ehjdh-2026/index.md
    - Competitions:
      - "Virtual Cell Challenge": papers/virtual-cell-challenge/index.md
