site_name: Omics AI Handbook
site_description: Anomaly-detection-based virtual tissue modelling
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
  - mermaid2
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            "Home": "首页"
            "Onboarding": "入门"
            "Day 1 · Understand": "第 1 天 · 读懂"
            "Day 2 · Hands-on (optional)": "第 2 天 · 上手（可选）"
            "Glossary": "名词表"
            "Papers": "论文"
            "Datasets": "数据集"
            "Research topics": "研究课题"
            "Literature review": "文献综述"
            "Knowledge map": "知识图谱"
            "Relationships": "论文关系"
            "Talks": "报告"
            "Slides & talk": "幻灯片与讲稿"
            "General anomaly detection": "通用异常检测"
            "Single-cell": "单细胞"
            "Spatial transcriptomics": "空间转录组"
            "Virtual tissues": "虚拟组织"
            "Histopathology": "组织病理"
            "Foundation models": "基础模型"
            "Pathology": "病理"
            "Imaging": "医学影像"
            "Competitions": "竞赛"
            "Biomedical agents & evaluation": "生物医学智能体与评测"
            "EHR & patient trajectories": "电子病历与病程"
            "Other": "其他"
extra_css:
  - assets/extra.css
  - onboarding/onboarding.css
extra_javascript:
  - onboarding/onboarding.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
